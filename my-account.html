<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Fantasy Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Zero-glyph override: JetBrains Mono's default "0" has a dot through the
   middle (to disambiguate from O), which reads as a decimal point at a
   glance on a scoreboard. Swaps in a plain zero for just U+0030, subsetted
   from Roboto Mono per weight so it matches JetBrains Mono's stroke weight
   closely — everything else still comes from JetBrains Mono itself. Must
   stay declared after the Google Fonts <link> above so this later rule wins
   for that one codepoint (CSS uses the last matching @font-face when
   unicode-ranges overlap). */
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-style: normal; unicode-range: U+0030; src: url('assets/zero-400.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 500; font-style: normal; unicode-range: U+0030; src: url('assets/zero-500.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 600; font-style: normal; unicode-range: U+0030; src: url('assets/zero-600.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 700; font-style: normal; unicode-range: U+0030; src: url('assets/zero-700.woff2') format('woff2'); }
:root {
  --bg: #08080a;
  --panel: #131317;
  --panel-2: #1a1a20;
  --border: #26262e;
  --border-soft: #1c1c22;
  --red: #ff3450;
  --red-dim: #7a1424;
  --gold: #dab35e;
  --gold-bright: #f0d391;
  --text: #eaeaef;
  --text-dim: #8b8b98;
  --text-mute: #4d4d58;
  --cyan: #3ec7ff;
  --green: #35d488;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scrollbar-color: var(--border) var(--bg); }
body {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  background:
    radial-gradient(ellipse 900px 500px at 12% -10%, rgba(255,52,80,0.14), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(218,179,94,0.10), transparent 55%),
    var(--bg);
  color: var(--text);
  font-size: 13px;
  min-height: 100vh;
  padding-bottom: 40px;
}
.page { max-width: 560px; margin: 0 auto; padding: 0 20px; }

.hero { padding: 28px 4px 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.hero-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: 3px; color: var(--red);
  background: rgba(255,52,80,0.1); border: 1px solid var(--red-dim);
  padding: 4px 10px; border-radius: 100px; margin-bottom: 10px;
}
.hero-tag::before { content:''; width:6px; height:6px; border-radius:50%; background: var(--red); box-shadow: 0 0 8px var(--red); }
h1 {
  font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; font-size: 26px; line-height: 1.1; margin-bottom: 8px;
  background: linear-gradient(100deg, var(--gold-bright), var(--gold) 55%, var(--red));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.status {
  display: inline-block; color: var(--text-dim); font-size: 11px;
  padding: 5px 12px; background: var(--panel); border: 1px solid var(--border-soft);
  border-radius: 100px;
}

.card {
  background: var(--panel); border: 1px solid var(--border-soft); border-radius: 10px;
  padding: 18px 20px; margin-bottom: 16px; position: relative; overflow: hidden;
}
.card::before {
  content: ''; display: block; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--red), var(--gold) 50%, var(--red));
}
.card-title {
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: 2px; color: var(--gold); margin-bottom: 14px;
}

label { display: block; color: var(--text-mute); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-family: 'Oswald', sans-serif; font-weight: 500; margin-bottom: 5px; }
select, input[type=text], input[type=password] {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  padding: 9px 11px; font-family: 'JetBrains Mono', monospace; font-size: 13px;
  width: 100%; border-radius: 6px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
select:focus, input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(255,52,80,0.15); }
.field { margin-bottom: 14px; }

.btn {
  display: inline-block; text-decoration: none; text-align: center;
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 12px;
  text-transform: uppercase; letter-spacing: 1px; padding: 10px 18px;
  border-radius: 100px; cursor: pointer; transition: border-color .15s, color .15s, background .15s;
}
.btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-bright); }
.btn:disabled { opacity: .4; cursor: default; }
.btn-primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #ff4d66; border-color: #ff4d66; color: #fff; }

.error-msg { color: var(--red); font-size: 12px; margin-top: 8px; }
.success-msg { color: var(--green); font-size: 12px; margin-top: 8px; }
.hint { color: var(--text-mute); font-size: 11px; margin-top: 6px; line-height: 1.5; }

.login-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--text-mute); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
.login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.site-nav {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 0; margin-bottom: 6px; font-family: 'Oswald', sans-serif;
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
}
.site-nav a { color: var(--text-dim); text-decoration: none; transition: color .15s; }
.site-nav a:hover { color: var(--gold-bright); }
.site-nav a.home { color: var(--gold); font-weight: 600; }
.site-nav .sep { color: var(--text-mute); }

.account-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 12px; }
.account-row:last-child { border-bottom: none; }
.account-row .k { color: var(--text-mute); text-transform: uppercase; font-size: 10px; letter-spacing: 1px; font-family: 'Oswald', sans-serif; }
.account-row .v { color: var(--text); font-weight: 600; }

.logout-link { color: var(--text-mute); font-size: 11px; cursor: pointer; text-decoration: underline; }
.logout-link:hover { color: var(--text); }
</style>
</head>
<body>
<div class="page">
  <div id="site-nav"></div>
  <header class="hero">
    <div class="hero-tag">My Account</div>
    <h1 id="page-title">My Account</h1>
    <div class="status" id="status">Loading...</div>
  </header>

  <div id="app"></div>
</div>

<script>
// Same rationale as my-board.html: this page is always opened directly, never
// through index.html's tab bar/iframe, so it never has the site header/nav
// unless we add it ourselves.
if (window.self === window.top) {
  document.getElementById('site-nav').innerHTML = `
    <nav class="site-nav">
      <a class="home" href="index.html">&larr; FantasyDraft</a>
      <span class="sep">/</span>
      <a href="scouting.html">Scouting</a>
      <a href="live-draft.html">Live Draft</a>
      <a href="live-scoring.html">Live Scoring</a>
    </nav>`;
}
</script>
<script>
const API_BASE = 'https://fantasy-draft.jhendrix6426.workers.dev';

const params = new URLSearchParams(location.search);
const state = {
  year: parseInt(params.get('year')) || 2026,
  gmId: null, gmToken: null, gmName: null,
  gmsPublic: [],
  error: null,
};

async function apiFetch(path, opts = {}) {
  const res = await fetch(API_BASE + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}
const publicGet = (path) => apiFetch(path, { method: 'GET' });
const gmFetch = (path, method, body) => apiFetch(path, {
  method, headers: { 'Content-Type': 'application/json', 'X-GM-Token': state.gmToken },
  body: body !== undefined ? JSON.stringify(body) : undefined,
});

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// Shared with live-draft.html/my-board.html on purpose — logging in on any of
// them logs you in on the others, since it's the same GM identity either way.
function saveGmSession() {
  localStorage.setItem('livedraft-gm', JSON.stringify({ gmId: state.gmId, gmToken: state.gmToken, gmName: state.gmName, year: state.year }));
}
function clearSession() {
  localStorage.removeItem('livedraft-gm');
  location.reload();
}

async function init() {
  setStatus('Connecting...');
  try { state.gmsPublic = await publicGet('/fantasy/gms'); } catch (e) { state.gmsPublic = []; }

  const linkGm = params.get('gm'), linkToken = params.get('token');
  if (linkGm && linkToken) {
    try {
      const v = await apiFetch('/fantasy/gms/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ gmId: linkGm, token: linkToken }) });
      state.gmId = v.id; state.gmName = v.name; state.gmToken = linkToken;
      saveGmSession();
      setStatus(`Logged in as ${state.gmName}`);
      render();
      return;
    } catch (e) { /* fall through to normal login */ }
  }

  const saved = JSON.parse(localStorage.getItem('livedraft-gm') || 'null');
  if (saved && saved.year === state.year) {
    state.gmId = saved.gmId; state.gmToken = saved.gmToken; state.gmName = saved.gmName;
    setStatus(`Logged in as ${state.gmName}`);
    render();
    return;
  }

  setStatus('Log in to manage your account');
  render();
}

async function loginAsGm() {
  const gmId = document.getElementById('gm-select').value;
  const token = document.getElementById('gm-token').value.trim();
  const errEl = document.getElementById('gm-login-error');
  errEl.textContent = '';
  if (!gmId || !token) { errEl.textContent = 'Pick your name and enter your token.'; return; }
  try {
    const v = await apiFetch('/fantasy/gms/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ gmId, token }) });
    state.gmId = v.id; state.gmName = v.name; state.gmToken = token;
    saveGmSession();
    setStatus(`Logged in as ${state.gmName}`);
    render();
  } catch (e) {
    errEl.textContent = 'That token doesn\'t match — check with the commissioner.';
  }
}

async function loginAsGmWithPassword() {
  const username = document.getElementById('gm-username').value.trim();
  const password = document.getElementById('gm-password').value;
  const errEl = document.getElementById('gm-password-login-error');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = 'Enter your username and password.'; return; }
  try {
    const v = await apiFetch('/fantasy/gms/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
    state.gmId = v.id; state.gmName = v.name; state.gmToken = v.token;
    saveGmSession();
    setStatus(`Logged in as ${state.gmName}`);
    render();
  } catch (e) {
    errEl.textContent = 'Incorrect username or password.';
  }
}

async function changePassword() {
  const currentPassword = document.getElementById('current-password').value;
  const newPassword = document.getElementById('new-password').value;
  const confirmPassword = document.getElementById('confirm-password').value;
  const errEl = document.getElementById('change-pw-error');
  const okEl = document.getElementById('change-pw-success');
  errEl.textContent = ''; okEl.textContent = '';
  if (!currentPassword || !newPassword) { errEl.textContent = 'Fill in both your current and new password.'; return; }
  if (newPassword.length < 6) { errEl.textContent = 'New password must be at least 6 characters.'; return; }
  if (newPassword !== confirmPassword) { errEl.textContent = 'New password and confirmation don\'t match.'; return; }
  try {
    await gmFetch('/fantasy/gms/change-password', 'POST', { gmId: state.gmId, currentPassword, newPassword });
    okEl.textContent = 'Password changed.';
    document.getElementById('current-password').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('confirm-password').value = '';
  } catch (e) {
    errEl.textContent = e.message === 'Current password is incorrect' ? e.message : 'Could not change password: ' + e.message;
  }
}

function render() {
  const app = document.getElementById('app');
  if (!state.gmId) { app.innerHTML = renderLogin(); attachLoginHandlers(); return; }
  app.innerHTML = renderAccount();
  attachAccountHandlers();
}

function renderLogin() {
  return `
    <div class="card">
      <div class="card-title">GM Login</div>
      <div class="field"><label>Username</label><input type="text" id="gm-username"></div>
      <div class="field"><label>Password</label><input type="password" id="gm-password"></div>
      <button class="btn btn-primary" id="gm-password-login-btn">Log In</button>
      <div class="error-msg" id="gm-password-login-error"></div>

      <div class="login-divider"><span>or use your commissioner-issued link/token</span></div>

      <div class="field"><label>Your Name</label>
        <select id="gm-select">
          <option value="">Select...</option>
          ${state.gmsPublic.map(g => `<option value="${g.id}">${g.name}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Your Token</label><input type="password" id="gm-token"></div>
      <button class="btn" id="gm-login-btn">Log In With Token</button>
      <div class="error-msg" id="gm-login-error"></div>
      <div class="hint">If you don't have a password yet, ask your commissioner to set one from the Live Draft GM Roster panel — then come back here to change it to something memorable.</div>
    </div>
  `;
}
function attachLoginHandlers() {
  document.getElementById('gm-login-btn').onclick = loginAsGm;
  document.getElementById('gm-password-login-btn').onclick = loginAsGmWithPassword;
}

function renderAccount() {
  return `
    <div class="card">
      <div class="card-title">Account</div>
      <div class="account-row"><span class="k">Name</span><span class="v">${state.gmName}</span></div>
      <div class="account-row"><span class="k">GM ID</span><span class="v">${state.gmId}</span></div>
    </div>
    <div class="card">
      <div class="card-title">Change Password</div>
      <div class="field"><label>Current Password</label><input type="password" id="current-password"></div>
      <div class="field"><label>New Password</label><input type="password" id="new-password"></div>
      <div class="field"><label>Confirm New Password</label><input type="password" id="confirm-password"></div>
      <button class="btn btn-primary" id="change-pw-btn">Change Password</button>
      <div class="error-msg" id="change-pw-error"></div>
      <div class="success-msg" id="change-pw-success"></div>
      <div class="hint">Don't know your current password? Ask your commissioner to reset it from the Live Draft GM Roster panel.</div>
    </div>
    <div style="margin-top:16px"><span class="logout-link" id="logout-link">Log out / switch role</span></div>
  `;
}
function attachAccountHandlers() {
  document.getElementById('change-pw-btn').onclick = changePassword;
  document.getElementById('logout-link').onclick = clearSession;
}

init();
</script>
</body>
</html>
