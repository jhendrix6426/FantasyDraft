<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Oswald', system-ui, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 12% -10%, rgba(255,52,80,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(218,179,94,0.10), transparent 55%),
      #08080a;
    color: #eaeaef;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    height: 64px;
    padding: 0 20px;
    position: relative;
    background:
      radial-gradient(ellipse 420px 160px at 6% -80%, rgba(255,52,80,0.30), transparent 70%),
      radial-gradient(ellipse 360px 160px at 96% -80%, rgba(218,179,94,0.24), transparent 65%),
      #0d0d10;
  }
  header::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, #ff3450, #dab35e 50%, #ff3450);
  }
  .brand {
    display: flex;
    align-items: center;
    height: 100%;
    flex-shrink: 0;
  }
  .brand img {
    height: 34px;
    width: auto;
    display: block;
  }
  nav.tabs {
    display: flex;
    gap: 4px;
  }
  nav.tabs button {
    background: transparent;
    border: 1px solid transparent;
    color: #8b8b98;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 100px;
    transition: color .15s, border-color .15s, background .15s;
  }
  nav.tabs button.active {
    background: #1a1a20;
    color: #f0d391;
    border-color: #dab35e;
  }
  nav.tabs button:disabled {
    color: #4d4d58;
    cursor: default;
  }
  nav.tabs button:not(:disabled):not(.active):hover {
    color: #eaeaef;
    background: rgba(255,255,255,0.04);
  }
  main {
    flex: 1;
    background: #131317;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="assets/header-small.png" alt="Fantasy Draft">
  </div>
  <nav class="tabs">
    <button class="active" data-tab="scouting">Scouting</button>
    <button data-tab="live-draft">Live Draft</button>
  </nav>
</header>
<main>
  <iframe id="tab-frame" src="scouting.html" title="Scouting"></iframe>
</main>
<script>
  document.querySelectorAll('nav.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled || btn.classList.contains('active')) return;
      document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const frame = document.getElementById('tab-frame');
      frame.src = btn.dataset.tab + '.html';
      frame.title = btn.textContent;
    });
  });
</script>
</body>
</html>
