<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Oswald', system-ui, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 12% -10%, rgba(255,52,80,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(218,179,94,0.10), transparent 55%),
      #08080a;
    color: #eaeaef;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    height: 64px;
    padding: 0 20px;
    position: relative;
    background:
      radial-gradient(ellipse 420px 160px at 6% -80%, rgba(255,52,80,0.30), transparent 70%),
      radial-gradient(ellipse 360px 160px at 96% -80%, rgba(218,179,94,0.24), transparent 65%),
      #0d0d10;
  }
  header::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, #ff3450, #dab35e 50%, #ff3450);
  }
  .brand {
    display: flex;
    align-items: center;
    height: 100%;
    flex-shrink: 0;
  }
  .brand img {
    height: 34px;
    width: auto;
    display: block;
  }
  nav.tabs {
    display: flex;
    gap: 4px;
  }
  nav.tabs button {
    background: transparent;
    border: 1px solid transparent;
    color: #8b8b98;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 100px;
    transition: color .15s, border-color .15s, background .15s;
  }
  nav.tabs button.active {
    background: #1a1a20;
    color: #f0d391;
    border-color: #dab35e;
  }
  nav.tabs button:disabled {
    color: #4d4d58;
    cursor: default;
  }
  nav.tabs button:not(:disabled):not(.active):hover {
    color: #eaeaef;
    background: rgba(255,255,255,0.04);
  }
  .tab-group { position: relative; }
  .tab-dropdown {
    display: none;
    flex-direction: column;
    gap: 2px;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    background: #1a1a20;
    border: 1px solid #26262e;
    border-radius: 10px;
    padding: 6px;
    min-width: 170px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    z-index: 20;
  }
  .tab-dropdown.open { display: flex; }
  .tab-dropdown button {
    text-align: left;
  }
  main {
    flex: 1;
    background: #131317;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="assets/header.png" alt="Fantasy Draft">
  </div>
  <nav class="tabs">
    <div class="tab-group">
      <button class="active tab-toggle" id="gm-tools-toggle" type="button" data-dropdown="gm-tools-dropdown">GM Tools &#9662;</button>
      <div class="tab-dropdown" id="gm-tools-dropdown">
        <button class="active" data-tab="scouting">Scouting</button>
        <button data-tab="my-board">My Draft Board</button>
        <button data-tab="my-account">My Account</button>
        <!-- Skips live-draft.html's role picker straight to the GM login form (see ?mode= handling there). -->
        <button data-tab="join-live-draft" data-src="live-draft.html?mode=gm">Join Live Draft</button>
      </div>
    </div>
    <div class="tab-group">
      <button class="tab-toggle" id="commish-tools-toggle" type="button" data-dropdown="commish-tools-dropdown">Commissioner Tools &#9662;</button>
      <div class="tab-dropdown" id="commish-tools-dropdown">
        <button data-tab="live-draft-setup" data-src="live-draft.html?mode=commish">Live Draft Setup</button>
        <button data-tab="scorekeeping" data-src="live-scoring.html">Scorekeeping</button>
      </div>
    </div>
    <!-- Bump the year in these two alongside FANTASY_DRAFT_YEAR in the other pages. -->
    <button data-tab="live-draft" data-src="draft-presentation.html?year=2026">Live Draft</button>
    <button data-tab="live-scoring" data-src="scoring-presentation.html?year=2026">Live Scoring</button>
    <button data-tab="draft-history">Draft History</button>
    <button data-tab="records">Records</button>
  </nav>
</header>
<main>
  <iframe id="tab-frame" src="scouting.html" title="Scouting"></iframe>
</main>
<script>
  const tabFrame = document.getElementById('tab-frame');
  const gmToolsToggle = document.getElementById('gm-tools-toggle');
  const commishToolsToggle = document.getElementById('commish-tools-toggle');
  const topLevelTabs = document.querySelectorAll('nav.tabs > button[data-tab]');
  const allDropdownItems = document.querySelectorAll('.tab-dropdown button[data-tab]');
  const allDropdowns = document.querySelectorAll('.tab-dropdown');
  const allToggles = document.querySelectorAll('.tab-toggle');
  const gmToolsTabNames = ['scouting', 'my-board', 'my-account', 'join-live-draft'];
  const commishToolsTabNames = ['live-draft-setup', 'scorekeeping'];

  // A button's src is data-tab + '.html' by default (e.g. "records" ->
  // records.html), unless it needs to land somewhere else or with query
  // params (e.g. Live Draft now opens the read-only presentation view, and
  // Join Live Draft/Live Draft Setup skip straight past live-draft.html's
  // role picker) — those set data-src explicitly and it wins.
  function setActiveTab(btn) {
    if (btn.disabled || btn.classList.contains('active')) return;
    topLevelTabs.forEach(b => b.classList.remove('active'));
    allDropdownItems.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gmToolsToggle.classList.toggle('active', gmToolsTabNames.includes(btn.dataset.tab));
    commishToolsToggle.classList.toggle('active', commishToolsTabNames.includes(btn.dataset.tab));
    tabFrame.src = btn.dataset.src || (btn.dataset.tab + '.html');
    tabFrame.title = btn.textContent;
  }

  topLevelTabs.forEach(btn => btn.addEventListener('click', () => setActiveTab(btn)));
  allDropdownItems.forEach(btn => {
    btn.addEventListener('click', () => {
      setActiveTab(btn);
      allDropdowns.forEach(d => d.classList.remove('open'));
    });
  });

  allToggles.forEach(toggle => {
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const dropdown = document.getElementById(toggle.dataset.dropdown);
      const wasOpen = dropdown.classList.contains('open');
      allDropdowns.forEach(d => d.classList.remove('open'));
      if (!wasOpen) dropdown.classList.add('open');
    });
  });
  allDropdowns.forEach(d => d.addEventListener('click', (e) => e.stopPropagation()));
  document.addEventListener('click', () => allDropdowns.forEach(d => d.classList.remove('open')));
  // A click inside the tab iframe never bubbles to this document (it's a
  // separate document), so the listener above alone can't close the dropdown
  // when clicking into the page content — which is most of the visible page.
  // A click into the iframe shifts window focus there, firing blur on the
  // parent window; use that as the close signal instead.
  window.addEventListener('blur', () => {
    if (document.activeElement === tabFrame) allDropdowns.forEach(d => d.classList.remove('open'));
  });
</script>
</body>
</html>
