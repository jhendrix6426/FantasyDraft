<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Draft</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, sans-serif;
    background: #0a0a0a;
    color: #ddd;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 0;
    background: #0a0a0a;
    border-bottom: 2px solid #c9202f;
  }
  .logo {
    height: 110px;
    width: auto;
    margin-bottom: 12px;
  }
  nav.tabs {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 900px;
    justify-content: center;
  }
  nav.tabs button {
    background: #141414;
    border: 1px solid #333;
    border-bottom: none;
    color: #999;
    font-family: monospace;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
  }
  nav.tabs button.active {
    background: #1a1a1a;
    color: #c9a84c;
    border-color: #c9a84c;
  }
  nav.tabs button:disabled {
    color: #444;
    cursor: default;
  }
  nav.tabs button:not(:disabled):not(.active):hover {
    color: #ddd;
  }
  main {
    flex: 1;
    background: #1a1a1a;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>
<header>
  <img class="logo" src="assets/logo.png" alt="Fantasy Draft">
  <nav class="tabs">
    <button class="active" data-tab="scouting">Scouting</button>
  </nav>
</header>
<main>
  <iframe id="tab-frame" src="scouting.html" title="Scouting"></iframe>
</main>
</body>
</html>
