<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Oswald', system-ui, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 12% -10%, rgba(255,52,80,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(218,179,94,0.10), transparent 55%),
      #08080a;
    color: #eaeaef;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  header::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;
    background: linear-gradient(90deg, #ff3450, #dab35e 50%, #ff3450);
  }
  .banner-wrap {
    width: 100%;
    aspect-ratio: 2400 / 600;
    position: relative;
    background-image: url('assets/header-banner.svg');
    background-size: 100% 100%;
  }
  .banner {
    width: 100%;
    height: 100%;
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }
  nav.tabs {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 900px;
    justify-content: center;
    padding: 14px 16px 0;
  }
  nav.tabs button {
    background: #131317;
    border: 1px solid #26262e;
    border-bottom: none;
    color: #8b8b98;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 11px 22px;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    transition: color .15s, border-color .15s;
  }
  nav.tabs button.active {
    background: #1a1a20;
    color: #f0d391;
    border-color: #dab35e;
  }
  nav.tabs button:disabled {
    color: #4d4d58;
    cursor: default;
  }
  nav.tabs button:not(:disabled):not(.active):hover {
    color: #eaeaef;
  }
  main {
    flex: 1;
    background: #131317;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>
<header>
  <div class="banner-wrap">
    <img class="banner" src="assets/header-elements.png" alt="Fantasy Draft">
  </div>
  <nav class="tabs">
    <button class="active" data-tab="scouting">Scouting</button>
  </nav>
</header>
<main>
  <iframe id="tab-frame" src="scouting.html" title="Scouting"></iframe>
</main>
</body>
</html>
