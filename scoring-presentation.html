<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Scoring Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="records.js"></script>
<style>
:root {
  --bg: #08080a;
  --panel: #131317;
  --panel-2: #1a1a20;
  --border: #26262e;
  --red: #ff3450;
  --gold: #dab35e;
  --gold-bright: #f0d391;
  --text: #eaeaef;
  --text-dim: #8b8b98;
  --text-mute: #4d4d58;
  --green: #35d488;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  background:
    radial-gradient(ellipse 1200px 700px at 10% -10%, rgba(255,52,80,0.16), transparent 60%),
    radial-gradient(ellipse 900px 700px at 100% 0%, rgba(218,179,94,0.12), transparent 55%),
    radial-gradient(circle, rgba(218,179,94,0.10) 1.4px, transparent 1.4px) 0 0/30px 30px repeat,
    var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: 22px 28px;
}

/* HEADER STRIP */
.strip {
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; padding-bottom: 16px; border-bottom: 2px solid var(--border); margin-bottom: 18px;
}
.strip-left { font-family: 'Oswald', sans-serif; font-weight: 600; color: var(--text-dim); font-size: 18px; letter-spacing: 1px; text-transform: uppercase; }
.strip-title {
  font-family: 'Oswald', sans-serif; font-weight: 800; text-transform: uppercase;
  font-size: 34px; letter-spacing: 1px; text-align: center; flex: 1;
  background: linear-gradient(100deg, var(--gold-bright), var(--gold) 55%, var(--red));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.day-pills { display: flex; gap: 8px; }
.day-pill {
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  padding: 5px 12px; border-radius: 100px; border: 1px solid var(--border); color: var(--text-mute);
}
.day-pill.final { border-color: var(--green); color: var(--green); }
.day-pill.live { border-color: var(--red); color: var(--gold-bright); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

/* LEADERBOARD — rows flex-grow to fill whatever vertical space is available
   (no more centering a handful of small rows in a sea of empty space), and
   name/score are sized to be the dominant thing on screen; the day-by-day
   breakdown stays deliberately secondary. */
.leaderboard-wrap { flex: 1; display: flex; flex-direction: column; gap: 20px; overflow: hidden; }
.lb-row {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; justify-content: center; gap: 10px; position: relative;
  padding: 14px 30px; border-radius: 16px; background: rgba(255,255,255,0.015);
  border: 1px solid transparent;
}
.lb-row-main { display: flex; align-items: center; gap: 26px; }
/* EXPERIMENTAL — roster listing under name/bar, see if it's useful or too busy. */
.lb-roster {
  color: var(--text-dim); font-size: 15px; letter-spacing: .3px; line-height: 1.7;
  padding-bottom: 2px;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.lb-row.flash { animation: rowFlash 1.3s ease; }
@keyframes rowFlash {
  0% { box-shadow: 0 0 0 rgba(0,0,0,0); border-color: transparent; }
  25% { box-shadow: 0 0 34px var(--team-a); border-color: var(--team-a); }
  100% { box-shadow: 0 0 0 rgba(0,0,0,0); border-color: transparent; }
}
.lb-rank {
  font-family: 'Oswald', sans-serif; font-weight: 800; font-size: 58px; color: var(--team-a);
  width: 90px; text-align: center; text-shadow: 0 0 14px var(--team-a); flex-shrink: 0;
}
.lb-crown { font-size: 32px; margin-right: 4px; }
.lb-name {
  font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase; font-size: 44px;
  width: 400px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lb-bar-wrap { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; height: 58px; position: relative; }
.lb-bar {
  height: 100%; background: linear-gradient(90deg, var(--team-a), var(--team-b));
  border-radius: 8px 0 0 8px; transition: width .7s cubic-bezier(.2,.8,.2,1);
  box-shadow: 0 0 16px -2px var(--team-a) inset;
}
.lb-days { display: flex; gap: 10px; width: 250px; flex-shrink: 0; }
.day-chip {
  font-size: 13px; text-align: center; color: var(--text-dim); font-weight: 600;
  padding: 7px 8px; border-radius: 6px; background: var(--panel-2); flex: 1;
}
.day-chip b { display: block; font-size: 19px; color: var(--text); }
.lb-total {
  font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--gold-bright); font-size: 62px;
  width: 180px; text-align: right; flex-shrink: 0; position: relative;
}
.lb-delta {
  position: absolute; right: 0; top: -24px; color: var(--green); font-size: 19px; font-weight: 700;
  animation: floatDelta 1.6s ease forwards;
}
@keyframes floatDelta {
  0% { opacity: 0; transform: translateY(6px); }
  20% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-16px); }
}

.empty-msg { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-mute); font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }

/* SPOTLIGHT */
.spotlight {
  display: flex; align-items: center; gap: 14px; padding: 12px 18px; margin-top: 4px;
  border-radius: 10px; background: linear-gradient(120deg, rgba(255,255,255,0.03), transparent);
  border: 1px solid var(--border); border-left: 3px solid var(--gold);
}
.spotlight-label {
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--text-mute); flex-shrink: 0;
}
.spotlight-name { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; color: var(--gold-bright); text-transform: uppercase; }
.spotlight-meta { color: var(--text-dim); font-size: 12px; }

/* TICKER */
.ticker-wrap {
  border-top: 2px solid var(--border); margin-top: 16px; padding-top: 14px;
  height: 42px; display: flex; align-items: center; overflow: hidden;
}
.ticker-item {
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 19px; text-transform: uppercase;
  letter-spacing: .5px; color: var(--gold-bright); opacity: 0; transition: opacity .5s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
}
.ticker-item.show { opacity: 1; }
.ticker-item .rec { color: var(--red); }

/* BIG MOMENT POPUP */
.moment-overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 50;
}
.moment-card {
  background: linear-gradient(135deg, var(--panel-2), var(--panel));
  border: 2px solid var(--gold); border-radius: 16px; padding: 34px 56px;
  text-align: center; box-shadow: 0 0 60px rgba(218,179,94,0.4), 0 0 120px rgba(255,52,80,0.25);
  transform: scale(0.7); opacity: 0; transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .25s;
  max-width: 900px;
}
.moment-card.show { transform: scale(1); opacity: 1; }
.moment-kicker { color: var(--red); font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
.moment-title {
  font-family: 'Oswald', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 44px;
  background: linear-gradient(100deg, var(--gold-bright), var(--gold) 55%, var(--red));
  -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; line-height: 1.15;
}
.moment-sub { color: var(--text-dim); font-size: 16px; letter-spacing: .5px; }

/* Low-key by default so it doesn't clutter the broadcast view — fully
   visible on hover, still tappable at low opacity on touchscreens/TVs
   that can't hover. */
.fullscreen-btn {
  position: fixed; top: 14px; right: 14px; z-index: 100;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 8px; width: 34px; height: 34px; font-size: 17px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; opacity: 0.35;
  transition: opacity .2s, border-color .2s, color .2s;
}
.fullscreen-btn:hover { opacity: 1; border-color: var(--gold); color: var(--gold-bright); }
</style>
</head>
<body>
  <button class="fullscreen-btn" id="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle fullscreen">⛶</button>
  <div class="strip">
    <div class="strip-left" id="strip-left">Fantasy Draft</div>
    <div class="strip-title" id="strip-title">Live Scoring</div>
    <div class="day-pills" id="day-pills"></div>
  </div>
  <div class="leaderboard-wrap" id="leaderboard-wrap"></div>
  <div class="spotlight" id="spotlight" style="display:none"></div>
  <div class="ticker-wrap"><div class="ticker-item" id="ticker-item"></div></div>
  <div class="moment-overlay"><div class="moment-card" id="moment-card"></div></div>

<script>
const API_BASE = 'https://fantasy-draft.jhendrix6426.workers.dev';
const NATS_URL = 'https://nationals-history.jhendrix6426.workers.dev/nationals/db';
const params = new URLSearchParams(location.search);
const YEAR = parseInt(params.get('year')) || 2026;
const DAY_LABEL = { thu: 'Thu', fri: 'Fri', sat: 'Sat' };
const DAY_LABEL_FULL = { thu: 'Thursday', fri: 'Friday', sat: 'Saturday' };

// For a TV/kiosk setup where a keyboard shortcut isn't convenient — button
// itself stays low-opacity (see .fullscreen-btn) so it doesn't clutter the
// broadcast view, and its icon/tooltip track actual fullscreen state so it
// stays correct even if fullscreen is exited via Escape or the OS itself
// rather than this button.
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('fullscreen-btn');
  if (!btn) return;
  const isFull = !!document.fullscreenElement;
  btn.textContent = isFull ? '⤢' : '⛶';
  btn.title = isFull ? 'Exit fullscreen' : 'Toggle fullscreen';
});

// Stable per-team accent colors — assigned in first-seen order (not hashed,
// which can collide between two team ids and give them the same color) so
// each team's color never changes as standings reshuffle, and no two teams
// share a color as long as there are <= 8 of them.
const TEAM_COLORS = [
  { a: '#ff3450', b: '#ff8a9b' },
  { a: '#dab35e', b: '#f0d391' },
  { a: '#3ec7ff', b: '#8fe0ff' },
  { a: '#35d488', b: '#8ff5c0' },
  { a: '#c295ff', b: '#e0c7ff' },
  { a: '#ffab6b', b: '#ffd4ab' },
  { a: '#ff6ec7', b: '#ffb3e6' },
  { a: '#6effa0', b: '#b3ffcf' },
];
const teamColorMap = {};
let nextColorIndex = 0;
function colorForGm(gm) {
  if (!(gm in teamColorMap)) {
    teamColorMap[gm] = TEAM_COLORS[nextColorIndex % TEAM_COLORS.length];
    nextColorIndex++;
  }
  return teamColorMap[gm];
}
function r1(n) { return Math.round(n * 10) / 10; }

let gms = [];
let recordsBook = null;
let tickerItems = ['Loading...'];
let tickerIndex = 0;
let tickerTimer = null;
let prevTotals = {};       // gm -> last-seen seasonTotal, for flash/delta detection
let shownMoments = new Set(); // dedupe keys for one-time big-moment popups
let momentQueue = [];
let momentPlaying = false;

function gmName(id) {
  const g = gms.find(g => g.id === id);
  return g ? g.name : id;
}

async function fetchJson(url) {
  const res = await fetch(url);
  return res.json();
}

function renderStrip(ls) {
  document.getElementById('strip-left').textContent = `${ls.year} Season`;
  document.getElementById('day-pills').innerHTML = ['thu','fri','sat'].map(d => {
    const dayData = ls.days[d] || { status: 'active', entries: [] };
    const cls = dayData.status === 'final' ? 'final' : (dayData.entries.length ? 'live' : '');
    return `<div class="day-pill ${cls}">${DAY_LABEL[d]}</div>`;
  }).join('');
}

function renderLeaderboard(ls) {
  const wrap = document.getElementById('leaderboard-wrap');
  if (!ls.teams.length) {
    wrap.innerHTML = '<div class="empty-msg">Waiting for a live draft to establish team rosters...</div>';
    return;
  }
  const sorted = [...ls.teams].sort((a, b) => b.seasonTotal - a.seasonTotal);
  const max = Math.max(1, ...sorted.map(t => t.seasonTotal));
  const playerTotals = computePlayerSeasonTotals(ls);

  // FLIP animation: capture each row's current position before re-sorting,
  // so a rank change animates as a shuffle instead of an instant jump.
  const firstRects = {};
  wrap.querySelectorAll('.lb-row').forEach(el => { firstRects[el.dataset.gm] = el.getBoundingClientRect(); });

  sorted.forEach(t => {
    const prev = prevTotals[t.gm];
    t._changed = prev !== undefined && prev !== t.seasonTotal;
    t._delta = prev !== undefined ? r1(t.seasonTotal - prev) : 0;
  });

  wrap.innerHTML = sorted.map((t, i) => {
    const color = colorForGm(t.gm);
    return `
    <div class="lb-row ${t._changed ? 'flash' : ''}" data-gm="${t.gm}" style="--team-a:${color.a};--team-b:${color.b}">
      <div class="lb-row-main">
        <div class="lb-rank">${i === 0 ? '<span class="lb-crown">&#9812;</span>' : ''}${i + 1}</div>
        <div class="lb-name">${gmName(t.gm)}</div>
        <div class="lb-bar-wrap"><div class="lb-bar" style="width:${(t.seasonTotal / max) * 100}%"></div></div>
        <div class="lb-days">
          <div class="day-chip">THU<b>${t.dayTotals.thu}</b></div>
          <div class="day-chip">FRI<b>${t.dayTotals.fri}</b></div>
          <div class="day-chip">SAT<b>${t.dayTotals.sat}</b></div>
        </div>
        <div class="lb-total">${t._changed && t._delta > 0 ? `<span class="lb-delta">+${t._delta}</span>` : ''}${t.seasonTotal}</div>
      </div>
      <div class="lb-roster">${[...(t.roster || [])].sort((a, b) => (playerTotals[b.name] || 0) - (playerTotals[a.name] || 0)).map(p => `${p.name} (${r1(playerTotals[p.name] || 0)})`).join(' &middot; ')}</div>
    </div>`;
  }).join('');

  // Invert + play the FLIP transform for any row whose position moved.
  wrap.querySelectorAll('.lb-row').forEach(el => {
    const first = firstRects[el.dataset.gm];
    if (!first) return;
    const last = el.getBoundingClientRect();
    const dy = first.top - last.top;
    if (Math.abs(dy) > 0.5) {
      el.style.transition = 'none';
      el.style.transform = `translateY(${dy}px)`;
      requestAnimationFrame(() => {
        el.style.transition = 'transform .55s cubic-bezier(.2,.8,.2,1)';
        el.style.transform = '';
      });
    }
  });

  sorted.forEach(t => { prevTotals[t.gm] = t.seasonTotal; });
}

function renderSpotlight(ls) {
  const el = document.getElementById('spotlight');
  // Spotlight the most relevant day: the last one with any entries at all.
  let day = null;
  for (const d of ['sat', 'fri', 'thu']) {
    if (ls.days[d] && ls.days[d].entries.length) { day = d; break; }
  }
  if (!day) { el.style.display = 'none'; return; }

  const { totals } = computeDayBreakdown(day, ls.days[day].entries, ls.teams);
  const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  if (!sorted.length) { el.style.display = 'none'; return; }
  const [player, pts] = sorted[0];
  const isFinal = ls.days[day].status === 'final';

  el.style.display = 'flex';
  el.innerHTML = `
    <div class="spotlight-label">${isFinal ? DAY_LABEL_FULL[day] + ' Top Scorer' : 'Live Leader — ' + DAY_LABEL_FULL[day]}</div>
    <div class="spotlight-name">${player}</div>
    <div class="spotlight-meta">${pts} pts</div>
  `;
}

// Every player's running total across all three days so far — used to show
// each roster player's individual contribution next to their name.
function computePlayerSeasonTotals(ls) {
  const totals = {};
  for (const day of ['thu', 'fri', 'sat']) {
    const entries = (ls.days[day] && ls.days[day].entries) || [];
    for (const e of entries) totals[e.player] = (totals[e.player] || 0) + e.pts;
  }
  return totals;
}

// Groups a day's raw entries into per-player totals, then by each player's
// registered format for that day (from their roster registration), so we can
// compare against RecordsBook's per-format all-time thresholds.
function computeDayBreakdown(day, entries, teams) {
  const formatOf = {};
  for (const t of teams) for (const p of t.roster) formatOf[p.name] = p[day];
  const totals = {};
  for (const e of entries) totals[e.player] = (totals[e.player] || 0) + e.pts;
  const byFormat = {};
  for (const [player, pts] of Object.entries(totals)) {
    const fmt = formatOf[player];
    if (!fmt) continue;
    (byFormat[fmt] = byFormat[fmt] || []).push({ player, pts });
  }
  return { totals, byFormat };
}

// Season-wide record content — separate from the per-day loop below since
// none of this is tied to a specific day's entries: "did you know" call-outs
// for anyone playing this year who already holds an all-time record, plus
// live tracking of how close this year's best individual/team total is to
// the all-time season/team records. Runs even before any scores are entered
// (pure history), unlike the day-based items which need real entries.
function buildRecordItems(ls) {
  if (!recordsBook || typeof RecordsBook === 'undefined') return [];
  const items = [];

  const seen = new Set();
  for (const t of ls.teams) {
    const gm = gmName(t.gm);
    if (!seen.has(gm)) {
      seen.add(gm);
      for (const r of RecordsBook.recordsForPlayer(recordsBook, gm)) {
        items.push(`&#127942; ${gm} holds the all-time ${r.label}: ${r.value} (${r.year})`);
      }
    }
    for (const p of (t.roster || [])) {
      if (seen.has(p.name)) continue;
      seen.add(p.name);
      for (const r of RecordsBook.recordsForPlayer(recordsBook, p.name)) {
        items.push(`&#127942; ${p.name} holds the all-time ${r.label}: ${r.value} (${r.year})`);
      }
    }
  }

  const playerTotals = computePlayerSeasonTotals(ls);
  const topPlayer = Object.entries(playerTotals).sort((a, b) => b[1] - a[1])[0];
  if (topPlayer && recordsBook.seasonTotal) {
    const [name, pts] = topPlayer;
    const diff = r1(recordsBook.seasonTotal.pts - pts);
    if (diff > 0) {
      items.push(`${name} is <span class="rec">${diff} pts off</span> the all-time season record (${recordsBook.seasonTotal.pts}, ${recordsBook.seasonTotal.player} ${recordsBook.seasonTotal.year})`);
    }
  }

  if (recordsBook.teamScore && ls.teams.length) {
    const topTeam = [...ls.teams].sort((a, b) => b.seasonTotal - a.seasonTotal)[0];
    const diff = r1(recordsBook.teamScore.pts - topTeam.seasonTotal);
    if (diff > 0) {
      items.push(`${gmName(topTeam.gm)} is <span class="rec">${diff} pts off</span> the all-time team score record (${recordsBook.teamScore.pts}, ${recordsBook.teamScore.gm} ${recordsBook.teamScore.year})`);
    }
  }

  return items;
}

// The persistent "spotlight" box (above) already covers the single overall
// leader of the most recently active day — this rotation exists to surface
// everything that box doesn't: per-format leaders, ongoing record-distance
// tracking (not just the one-time popup when someone actually crosses the
// line), a recap for any earlier day the spotlight has since moved on from,
// and season-wide record context from buildRecordItems above. A plain
// player headcount was the whole ticker before; it's gone.
function buildTickerItems(ls) {
  const items = [];
  for (const day of ['thu', 'fri', 'sat']) {
    const dayData = ls.days[day];
    if (!dayData || !dayData.entries.length) continue;
    const isFinal = dayData.status === 'final';
    const { totals, byFormat } = computeDayBreakdown(day, dayData.entries, ls.teams);
    const sortedOverall = Object.entries(totals).sort((a, b) => b[1] - a[1]);

    if (sortedOverall.length) {
      const [player, pts] = sortedOverall[0];
      items.push(`${DAY_LABEL_FULL[day]} ${isFinal ? 'top scorer' : 'leader'}: ${player} — ${pts} pts`);
    }

    for (const [fmt, list] of Object.entries(byFormat)) {
      if (!list.length) continue;
      const best = [...list].sort((a, b) => b.pts - a.pts)[0];
      const fmtLabel = (typeof RecordsBook !== 'undefined' && RecordsBook.FMT_LABEL[fmt]) || fmt;
      items.push(`${fmtLabel} pace-setter: ${best.player} — ${best.pts} pts`);

      const record = recordsBook && recordsBook.formatHighScore && recordsBook.formatHighScore[fmt];
      if (record) {
        const diff = r1(record.pts - best.pts);
        if (diff > 0) {
          items.push(`${best.player} is <span class="rec">${diff} pts off</span> the all-time ${fmtLabel} record (${record.pts}, ${record.player} ${record.year})`);
        }
      }
    }
  }
  items.push(...buildRecordItems(ls));
  return items.length ? items : ['Live scoring will appear here once entries start coming in'];
}

// One-time "big moment" popups for genuinely notable events (a day wrapping
// up, or a score meeting/beating an all-time record) — routine info stays in
// the small rotating ticker instead of competing for the same spotlight.
function detectMoments(ls) {
  for (const day of ['thu', 'fri', 'sat']) {
    const dayData = ls.days[day];
    if (!dayData || !dayData.entries.length) continue;
    const isFinal = dayData.status === 'final';
    const { totals, byFormat } = computeDayBreakdown(day, dayData.entries, ls.teams);

    if (isFinal) {
      const key = `recap:${day}`;
      if (!shownMoments.has(key)) {
        shownMoments.add(key);
        const [player, pts] = Object.entries(totals).sort((a, b) => b[1] - a[1])[0] || [];
        if (player) momentQueue.push({ kicker: `${DAY_LABEL_FULL[day]} Complete`, title: player, sub: `Led the day with ${pts} pts` });
      }
    }

    if (recordsBook) {
      for (const [fmt, list] of Object.entries(byFormat)) {
        const best = list.sort((a, b) => b.pts - a.pts)[0];
        const record = recordsBook.formatHighScore && recordsBook.formatHighScore[fmt];
        if (!record || best.pts < record.pts) continue;
        const key = `record:${day}:${fmt}:${best.player}`;
        if (shownMoments.has(key)) continue;
        shownMoments.add(key);
        const fmtLabel = RecordsBook.FMT_LABEL[fmt] || fmt;
        momentQueue.push({
          kicker: 'Record Watch',
          title: best.player,
          sub: `${isFinal ? 'Matched or broke' : 'Matching/beating'} the all-time ${fmtLabel} single-day record (${record.pts} pts, ${record.player} ${record.year})`,
        });
      }
    }
  }
  processMomentQueue();
}

function processMomentQueue() {
  if (momentPlaying || !momentQueue.length) return;
  momentPlaying = true;
  const m = momentQueue.shift();
  const card = document.getElementById('moment-card');
  card.innerHTML = `
    <div class="moment-kicker">${m.kicker}</div>
    <div class="moment-title">${m.title}</div>
    <div class="moment-sub">${m.sub}</div>
  `;
  requestAnimationFrame(() => card.classList.add('show'));
  setTimeout(() => {
    card.classList.remove('show');
    setTimeout(() => { momentPlaying = false; processMomentQueue(); }, 350);
  }, 4200);
}

function showTickerItem() {
  const el = document.getElementById('ticker-item');
  el.classList.remove('show');
  setTimeout(() => {
    el.innerHTML = tickerItems[tickerIndex % tickerItems.length];
    tickerIndex++;
    requestAnimationFrame(() => el.classList.add('show'));
  }, 400);
}

function startTicker() {
  if (tickerTimer) return;
  showTickerItem();
  tickerTimer = setInterval(showTickerItem, 6000);
}

let firstPoll = true;

async function poll() {
  try {
    const ls = await fetchJson(`${API_BASE}/fantasy/livescore/${YEAR}`);
    renderStrip(ls);
    renderLeaderboard(ls);
    renderSpotlight(ls);
    tickerItems = buildTickerItems(ls);
    // Skip moment popups on the very first load — don't replay a whole
    // event's history of records/recaps the instant the page opens.
    if (!firstPoll) detectMoments(ls);
    firstPoll = false;
  } catch (e) {
    document.getElementById('strip-title').textContent = 'Connection lost — retrying...';
  }
}

async function init() {
  try { gms = await fetchJson(`${API_BASE}/fantasy/gms`); } catch (e) { gms = []; }
  try {
    const db = await fetchJson(NATS_URL);
    recordsBook = RecordsBook.compute(db);
  } catch (e) { recordsBook = null; }

  await poll();
  setInterval(poll, 2500);
  startTicker();
}
init();
</script>
