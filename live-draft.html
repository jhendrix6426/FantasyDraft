<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Draft — Fantasy Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080a;
  --panel: #131317;
  --panel-2: #1a1a20;
  --border: #26262e;
  --border-soft: #1c1c22;
  --red: #ff3450;
  --red-dim: #7a1424;
  --gold: #dab35e;
  --gold-bright: #f0d391;
  --text: #eaeaef;
  --text-dim: #8b8b98;
  --text-mute: #4d4d58;
  --cyan: #3ec7ff;
  --green: #35d488;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scrollbar-color: var(--border) var(--bg); }
body {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  background:
    radial-gradient(ellipse 900px 500px at 12% -10%, rgba(255,52,80,0.14), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(218,179,94,0.10), transparent 55%),
    var(--bg);
  color: var(--text);
  font-size: 13px;
  min-height: 100vh;
  padding-bottom: 40px;
}
.page { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

.hero { padding: 28px 4px 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.hero-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: 3px; color: var(--red);
  background: rgba(255,52,80,0.1); border: 1px solid var(--red-dim);
  padding: 4px 10px; border-radius: 100px; margin-bottom: 10px;
}
.hero-tag::before { content:''; width:6px; height:6px; border-radius:50%; background: var(--red); box-shadow: 0 0 8px var(--red); }
h1 {
  font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; font-size: 28px; line-height: 1.1; margin-bottom: 8px;
  background: linear-gradient(100deg, var(--gold-bright), var(--gold) 55%, var(--red));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.status {
  display: inline-block; color: var(--text-dim); font-size: 11px;
  padding: 5px 12px; background: var(--panel); border: 1px solid var(--border-soft);
  border-radius: 100px;
}

.card {
  background: var(--panel); border: 1px solid var(--border-soft); border-radius: 10px;
  padding: 18px 20px; margin-bottom: 16px; position: relative; overflow: hidden;
}
.card::before {
  content: ''; display: block; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--red), var(--gold) 50%, var(--red));
}
.card-title {
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: 2px; color: var(--gold); margin-bottom: 14px;
}

label { display: block; color: var(--text-mute); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-family: 'Oswald', sans-serif; font-weight: 500; margin-bottom: 5px; }
select, input[type=text], input[type=password], input[type=number], textarea {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  padding: 9px 11px; font-family: 'JetBrains Mono', monospace; font-size: 13px;
  width: 100%; border-radius: 6px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
textarea { resize: vertical; min-height: 90px; }
select:focus, input:focus, textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(255,52,80,0.15); }
.field { margin-bottom: 14px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 160px; }

.btn {
  display: inline-block; text-decoration: none; text-align: center;
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 12px;
  text-transform: uppercase; letter-spacing: 1px; padding: 10px 18px;
  border-radius: 100px; cursor: pointer; transition: border-color .15s, color .15s, background .15s;
}
.btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-bright); }
.btn:disabled { opacity: .4; cursor: default; }
.btn-primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #ff4d66; border-color: #ff4d66; color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 10px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

.error-msg { color: var(--red); font-size: 12px; margin-top: 8px; }
.hint { color: var(--text-mute); font-size: 11px; margin-top: 6px; line-height: 1.5; }

.login-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--text-mute); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
.login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.site-nav {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 0; margin-bottom: 6px; font-family: 'Oswald', sans-serif;
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
}
.site-nav a { color: var(--text-dim); text-decoration: none; transition: color .15s; }
.site-nav a:hover { color: var(--gold-bright); }
.site-nav a.home { color: var(--gold); font-weight: 600; }
.site-nav .sep { color: var(--text-mute); }

.landing-choice { display: flex; gap: 14px; flex-wrap: wrap; }
.landing-choice button, .landing-choice a.btn { flex: 1; min-width: 200px; padding: 24px; }

.clock-banner {
  border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
  font-family: 'Oswald', sans-serif; text-align: center;
  border: 1px solid var(--border-soft); background: var(--panel);
}
.clock-banner.mine {
  background: linear-gradient(120deg, rgba(255,52,80,0.18), var(--panel-2));
  border-color: var(--red); box-shadow: 0 0 24px rgba(255,52,80,0.15);
}
.clock-banner .who { font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--gold-bright); }
.clock-banner .meta { color: var(--text-dim); font-size: 11px; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

.player-list { max-height: 420px; overflow-y: auto; border: 1px solid var(--border-soft); border-radius: 8px; }
.player-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--border-soft);
}
.player-row:last-child { border-bottom: none; }
.player-row:nth-child(even) { background: rgba(255,255,255,0.012); }
.player-name { font-weight: 600; }
.player-fmts { color: var(--text-mute); font-size: 10px; }

.feed { max-height: 320px; overflow-y: auto; }
.feed-item {
  display: flex; justify-content: space-between; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid var(--border-soft); font-size: 12px;
}
.feed-item:last-child { border-bottom: none; }
.feed-pick { color: var(--gold-bright); }
.feed-gm { color: var(--text-dim); }

.gm-editor-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.gm-editor-row input { flex: 1; }
.token-link-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.token-link { font-size: 10px; color: var(--cyan); word-break: break-all; flex: 1; }

.pw-reveal-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  padding: 8px 10px; border-radius: 6px;
  background: rgba(53,212,136,0.08); border: 1px solid rgba(53,212,136,0.35);
}
.pw-reveal-row .pw-text { flex: 1; font-size: 12px; color: var(--green); word-break: break-all; }

.modal-bg { display: none; position: fixed; inset: 0; background: rgba(4,4,6,.88); backdrop-filter: blur(2px); z-index: 1000; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 20px; }
.modal-bg.open { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 640px; margin: auto; padding: 0; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.modal-head {
  background: linear-gradient(120deg, rgba(255,52,80,0.16), var(--panel-2) 60%);
  padding: 18px 22px; border-bottom: 1px solid var(--border); border-top: 3px solid var(--red);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.modal-title { color: var(--text); font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.modal-close {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); padding: 5px 12px;
  cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 11px; flex-shrink: 0; border-radius: 100px;
  transition: color .15s, border-color .15s;
}
.modal-close:hover { color: var(--red); border-color: var(--red); }
.modal-body { padding: 18px 22px; max-height: 70vh; overflow-y: auto; }

.roster-order-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin-bottom: 4px;
  background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 6px; font-size: 12px;
}
.roster-order-item .pos { color: var(--gold); font-weight: 700; width: 20px; }

.board-list { max-height: 420px; overflow-y: auto; border: 1px solid var(--border-soft); border-radius: 8px; margin-bottom: 4px; }
.board-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-bottom: 1px solid var(--border-soft);
}
.board-row:last-child { border-bottom: none; }
.board-row.taken { opacity: 0.45; }
.board-row.taken .board-name { text-decoration: line-through; }
.board-rank { color: var(--gold); font-weight: 700; width: 22px; flex-shrink: 0; }
.board-name-wrap { flex: 1; min-width: 0; }
.board-name { font-weight: 600; }
.board-status { color: var(--text-mute); font-size: 10px; }

.logout-link { color: var(--text-mute); font-size: 11px; cursor: pointer; text-decoration: underline; }
.logout-link:hover { color: var(--text); }
</style>
</head>
<body>
<div class="page">
  <div id="site-nav"></div>
  <header class="hero">
    <div class="hero-tag">Live Draft</div>
    <h1 id="page-title">Fantasy Draft — Live</h1>
    <div class="status" id="status">Loading...</div>
  </header>

  <div id="app"></div>
</div>

<div class="modal-bg" id="board-modal-bg" onclick="if(event.target===this)closeBoardModal()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Full Draft Board</div>
      <button class="modal-close" onclick="closeBoardModal()">Close ✕</button>
    </div>
    <div class="modal-body" id="board-modal-body"></div>
  </div>
</div>

<script>
// GMs reach this page via a direct shareable link (?gm=...&token=...), not
// through index.html's tab bar/iframe — so unlike a normal tab visit, there's
// no site header/nav around them at all. Show a lightweight one, but only
// when this page isn't embedded in that iframe (where index.html's own
// header already provides it, and a second one would be redundant).
if (window.self === window.top) {
  document.getElementById('site-nav').innerHTML = `
    <nav class="site-nav">
      <a class="home" href="index.html">&larr; FantasyDraft</a>
      <span class="sep">/</span>
      <a href="scouting.html">Scouting</a>
      <a href="live-scoring.html">Live Scoring</a>
      <a href="draft-history.html">Draft History</a>
      <a href="records.html">Records</a>
    </nav>`;
}
</script>
<script>
const API_BASE = 'https://fantasy-draft.jhendrix6426.workers.dev';

const params = new URLSearchParams(location.search);
const state = {
  year: parseInt(params.get('year')) || 2026,
  role: null,           // 'gm' | 'commish'
  gmId: null, gmToken: null, gmName: null,
  commishKey: null,
  livedraft: null,      // last fetched /fantasy/livedraft/:year response
  gmsPublic: [],        // [{id,name,active}]
  playerPool: [],       // full year pool, fetched independent of draft status so a GM can board-build pre-draft
  board: [],            // this GM's own ranked wishlist (private, [names in rank order])
  search: '',            // player search text, model-synced (see note on render())
  pollTimer: null,
  submitting: false,
  error: null,
};

// ── API helpers ──────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const res = await fetch(API_BASE + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}
const publicGet = (path) => apiFetch(path, { method: 'GET' });
const commishFetch = (path, method, body) => apiFetch(path, {
  method, headers: { 'Content-Type': 'application/json', 'X-Commish-Key': state.commishKey },
  body: body !== undefined ? JSON.stringify(body) : undefined,
});
const gmFetch = (path, method, body) => apiFetch(path, {
  method, headers: { 'Content-Type': 'application/json', 'X-GM-Token': state.gmToken },
  body: body !== undefined ? JSON.stringify(body) : undefined,
});

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// ── Session persistence ──────────────────────────────────────
function saveGmSession() {
  localStorage.setItem('livedraft-gm', JSON.stringify({ gmId: state.gmId, gmToken: state.gmToken, gmName: state.gmName, year: state.year }));
}
function saveCommishSession() {
  localStorage.setItem('livedraft-commish', JSON.stringify({ commishKey: state.commishKey, year: state.year }));
}
function clearSession() {
  localStorage.removeItem('livedraft-gm');
  localStorage.removeItem('livedraft-commish');
  location.reload();
}

// ── Polling ───────────────────────────────────────────────────
// A background poll rebuilding the whole page mid-interaction is dangerous,
// not just annoying: it can destroy a <select> while its native dropdown is
// open (the "cursor disappearing" bug), and it silently ate the GM roster
// editor's typed input the same way before render()'s focus-preservation
// existed. isBackgroundPoll skips the render (data is still fetched and
// stored — just not painted) whenever focus is inside any form control, so
// an in-progress selection/typing is never pulled out from under the user.
// The next poll (or their own action) renders normally once they're done.
function isInteractingWithForm() {
  const el = document.activeElement;
  if (!el || !['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName)) return false;
  const app = document.getElementById('app');
  const modal = document.getElementById('board-modal-bg');
  // The board modal lives outside #app (see the render() note below), so its
  // own <select> needs the same protection or a background poll could
  // destroy it mid-click exactly like the bug this guard already fixed once.
  return (app && app.contains(el)) || (modal && modal.contains(el));
}

async function fetchLivedraft(isBackgroundPoll) {
  try {
    state.livedraft = await publicGet(`/fantasy/livedraft/${state.year}`);
    state.error = null;
  } catch (e) {
    state.error = 'Could not reach the draft server: ' + e.message;
  }
  if (isBackgroundPoll && isInteractingWithForm()) return;
  render();
}

function startPolling() {
  stopPolling();
  fetchLivedraft();
  state.pollTimer = setInterval(() => fetchLivedraft(true), 3000);
}

// Board-building needs the full year pool independent of draft status (the
// draft's own playerPool snapshot doesn't exist until the commissioner hits
// Start), plus this GM's own saved board. Loaded once at login, not polled.
async function loadGmExtras() {
  try { state.playerPool = await publicGet(`/fantasy/players/${state.year}`); } catch (e) { state.playerPool = []; }
  try {
    const r = await gmFetch(`/fantasy/livedraft/${state.year}/board?gmId=${encodeURIComponent(state.gmId)}`, 'GET');
    state.board = r.board || [];
  } catch (e) { state.board = []; }
  render();
}
function stopPolling() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopPolling();
  else if (state.role) startPolling();
});

// ── Init ──────────────────────────────────────────────────────
async function init() {
  setStatus('Connecting...');
  try {
    state.gmsPublic = await publicGet('/fantasy/gms');
  } catch (e) {
    state.gmsPublic = [];
  }

  // Pre-filled GM link: ?gm=id&token=xxx
  const linkGm = params.get('gm'), linkToken = params.get('token');
  if (linkGm && linkToken) {
    try {
      const v = await apiFetch('/fantasy/gms/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ gmId: linkGm, token: linkToken }) });
      state.role = 'gm'; state.gmId = v.id; state.gmName = v.name; state.gmToken = linkToken;
      saveGmSession();
      setStatus(`Logged in as ${state.gmName}`);
      loadGmExtras();
      startPolling();
      return;
    } catch (e) { /* fall through to normal login */ }
  }

  const savedGm = JSON.parse(localStorage.getItem('livedraft-gm') || 'null');
  if (savedGm && savedGm.year === state.year) {
    state.role = 'gm'; state.gmId = savedGm.gmId; state.gmToken = savedGm.gmToken; state.gmName = savedGm.gmName;
    setStatus(`Logged in as ${state.gmName}`);
    loadGmExtras();
    startPolling();
    return;
  }

  const savedCommish = JSON.parse(localStorage.getItem('livedraft-commish') || 'null');
  if (savedCommish && savedCommish.year === state.year) {
    state.role = 'commish'; state.commishKey = savedCommish.commishKey;
    setStatus('Logged in as Commissioner');
    startPolling();
    return;
  }

  setStatus('Choose your role to continue');
  render();
}

// ── Login actions ────────────────────────────────────────────
async function loginAsGm() {
  const gmId = document.getElementById('gm-select').value;
  const token = document.getElementById('gm-token').value.trim();
  const errEl = document.getElementById('gm-login-error');
  errEl.textContent = '';
  if (!gmId || !token) { errEl.textContent = 'Pick your name and enter your token.'; return; }
  try {
    const v = await apiFetch('/fantasy/gms/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ gmId, token }) });
    state.role = 'gm'; state.gmId = v.id; state.gmName = v.name; state.gmToken = token;
    saveGmSession();
    setStatus(`Logged in as ${state.gmName}`);
    loadGmExtras();
    startPolling();
  } catch (e) {
    errEl.textContent = 'That token doesn\'t match — check with the commissioner.';
  }
}

async function loginAsGmWithPassword() {
  const username = document.getElementById('gm-username').value.trim();
  const password = document.getElementById('gm-password').value;
  const errEl = document.getElementById('gm-password-login-error');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = 'Enter your username and password.'; return; }
  try {
    const v = await apiFetch('/fantasy/gms/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
    state.role = 'gm'; state.gmId = v.id; state.gmName = v.name; state.gmToken = v.token;
    saveGmSession();
    setStatus(`Logged in as ${state.gmName}`);
    loadGmExtras();
    startPolling();
  } catch (e) {
    errEl.textContent = 'Incorrect username or password.';
  }
}

async function loginAsCommish() {
  const key = document.getElementById('commish-key').value;
  const errEl = document.getElementById('commish-login-error');
  errEl.textContent = '';
  state.commishKey = key;
  try {
    await commishFetch(`/fantasy/gms?full=1`, 'GET'); // validates the key
    state.role = 'commish';
    saveCommishSession();
    setStatus('Logged in as Commissioner');
    startPolling();
  } catch (e) {
    state.commishKey = null;
    errEl.textContent = 'Incorrect passphrase.';
    render();
  }
}

// ── GM actions ────────────────────────────────────────────────
async function submitPick(playerName) {
  if (state.submitting) return;
  if (!confirm(`Draft ${playerName}?`)) return;
  state.submitting = true; render();
  const pickRequestId = crypto.randomUUID();
  try {
    await gmFetch(`/fantasy/livedraft/${state.year}/pick`, 'POST', { gmId: state.gmId, player: playerName, pickRequestId });
  } catch (e) {
    state.error = e.message;
  }
  state.submitting = false;
  await fetchLivedraft();
}

// ── GM draft board ──────────────────────────────────────────────
async function saveBoard() {
  try {
    await gmFetch(`/fantasy/livedraft/${state.year}/board`, 'PUT', { gmId: state.gmId, board: state.board });
  } catch (e) { /* board still reflects locally; next edit will retry the save */ }
}
function addToBoard(name) {
  if (!name || state.board.includes(name)) return;
  state.board.push(name);
  render();
  saveBoard();
}
function removeFromBoard(idx) {
  state.board.splice(idx, 1);
  render();
  saveBoard();
}
function moveBoard(idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= state.board.length) return;
  [state.board[idx], state.board[j]] = [state.board[j], state.board[idx]];
  render();
  saveBoard();
}

// ── Commissioner actions ──────────────────────────────────────
let commishGmRows = null; // working copy of full GM list (with tokens) while editing

async function loadGmEditor() {
  try {
    commishGmRows = await commishFetch('/fantasy/gms?full=1', 'GET');
  } catch (e) { commishGmRows = []; }
  render();
}

function addGmRow() {
  if (!commishGmRows) commishGmRows = [];
  commishGmRows.push({ id: '', name: '', token: crypto.randomUUID().replace(/-/g,'').slice(0,16), active: true });
  render();
}
function gmLinkFor(r) { return `${location.origin}${location.pathname}?gm=${r.id}&token=${r.token}`; }
function refreshGmLinkRow(i) {
  const r = commishGmRows[i];
  const linkEl = document.getElementById('gm-link-'+i);
  if (linkEl) linkEl.textContent = gmLinkFor(r);
  const copyBtn = document.querySelector(`[data-copy-link="${i}"]`);
  if (copyBtn) { copyBtn.disabled = !r.id; copyBtn.title = r.id ? '' : 'Enter an id first'; }
}
async function copyGmLink(i, btn) {
  const link = gmLinkFor(commishGmRows[i]);
  const original = btn.textContent;
  try {
    await navigator.clipboard.writeText(link);
    btn.textContent = 'Copied!';
  } catch (e) {
    const linkEl = document.getElementById('gm-link-'+i);
    const range = document.createRange();
    range.selectNodeContents(linkEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    btn.textContent = 'Selected';
  }
  setTimeout(() => { btn.textContent = original; }, 1500);
}
function removeGmRow(idx) {
  commishGmRows.splice(idx, 1);
  render();
}
async function saveGmRows() {
  const errEl = document.getElementById('gm-editor-error');
  const rows = commishGmRows.map((r, i) => ({
    id: (document.getElementById('gm-id-'+i).value || '').trim(),
    name: (document.getElementById('gm-name-'+i).value || '').trim(),
    username: (document.getElementById('gm-username-'+i).value || '').trim(),
    token: r.token,
    active: true,
  }));
  if (rows.some(r => !r.id || !r.name)) { errEl.textContent = 'Every GM needs both an id and a name.'; return; }
  try {
    await commishFetch('/fantasy/gms', 'PUT', rows);
    // The server never sends password hashes back (see the GET handler), so
    // merge the saved fields into the working copy rather than replacing it —
    // that keeps each row's hasPassword flag intact instead of losing it.
    commishGmRows = commishGmRows.map((r, i) => ({ ...r, ...rows[i] }));
    state.gmsPublic = await publicGet('/fantasy/gms');
    errEl.textContent = '';
    render();
  } catch (e) { errEl.textContent = e.message; }
}

async function resetGmPassword(idx) {
  const r = commishGmRows[idx];
  if (!r.id) { alert('Save this GM with an id first.'); return; }
  if (!confirm(`Reset ${r.name || r.id}'s password? Their old password (if any) stops working immediately.`)) return;
  try {
    const result = await commishFetch('/fantasy/gms/reset-password', 'POST', { gmId: r.id });
    commishGmRows[idx].hasPassword = true;
    commishGmRows[idx].revealedPassword = result.newPassword;
    render();
  } catch (e) {
    alert('Could not reset password: ' + e.message);
  }
}
function hideGmPassword(idx) {
  delete commishGmRows[idx].revealedPassword;
  render();
}
async function copyGmPassword(idx, btn) {
  const password = commishGmRows[idx].revealedPassword;
  if (!password) return;
  const original = btn.textContent;
  try {
    await navigator.clipboard.writeText(password);
    btn.textContent = 'Copied!';
  } catch (e) {
    const el = document.getElementById('gm-revealed-pw-' + idx);
    if (el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      btn.textContent = 'Selected';
    }
  }
  setTimeout(() => { btn.textContent = original; }, 1500);
}

async function savePlayerPool() {

  const year = document.getElementById('pool-year').value.trim() || state.year;
  let list;
  try { list = JSON.parse(document.getElementById('pool-json').value); }
  catch (e) { errEl.textContent = 'That\'s not valid JSON.'; return; }
  if (!Array.isArray(list)) { errEl.textContent = 'Player pool must be a JSON array.'; return; }
  try {
    await commishFetch(`/fantasy/players/${year}`, 'PUT', list);
    errEl.textContent = `Saved ${list.length} players for ${year}.`;
  } catch (e) { errEl.textContent = e.message; }
}

let draftOrderRows = null; // working array of GM ids for the draft order builder

async function startDraft() {
  const errEl = document.getElementById('start-error');
  const rosterSize = parseInt(document.getElementById('roster-size').value);
  const playerPoolYear = document.getElementById('pool-year-start').value.trim() || state.year;
  if (!draftOrderRows || !draftOrderRows.length) { errEl.textContent = 'Add at least one GM to the draft order.'; return; }
  if (!rosterSize || rosterSize < 1) { errEl.textContent = 'Roster size must be a positive number.'; return; }
  try {
    await commishFetch(`/fantasy/livedraft/${state.year}/start`, 'POST', { draftOrder: draftOrderRows, rosterSize, playerPoolYear });
    errEl.textContent = '';
    await fetchLivedraft();
  } catch (e) { errEl.textContent = e.message; }
}
async function pauseDraft() { await commishFetch(`/fantasy/livedraft/${state.year}/pause`, 'POST'); await fetchLivedraft(); }
async function resumeDraft() { await commishFetch(`/fantasy/livedraft/${state.year}/resume`, 'POST'); await fetchLivedraft(); }
async function undoPick() {
  if (!confirm('Undo the most recent pick?')) return;
  await commishFetch(`/fantasy/livedraft/${state.year}/undo`, 'POST'); await fetchLivedraft();
}
async function resetDraft() {
  const typed = prompt(`This wipes the draft order, roster size, player pool, and all picks for ${state.year} back to pre-draft — GM boards and roster/tokens are untouched. Type the year (${state.year}) to confirm.`);
  if (typed !== String(state.year)) return;
  await commishFetch(`/fantasy/livedraft/${state.year}/reset`, 'POST');
  draftOrderRows = null;
  await fetchLivedraft();
}
async function finalizeDraft() {
  const errEl = document.getElementById('finalize-error');
  const typed = prompt(`This permanently locks the roster for ${state.year} — undo, reset, and pool edits will no longer be possible, and there is no in-app way to reverse it. Type the year (${state.year}) to confirm.`);
  if (typed !== String(state.year)) return;
  try {
    await commishFetch(`/fantasy/livedraft/${state.year}/finalize`, 'POST');
    if (errEl) errEl.textContent = '';
    await fetchLivedraft();
  } catch (e) { if (errEl) errEl.textContent = e.message; }
}

function addToDraftOrder(gmId) {
  if (!draftOrderRows) draftOrderRows = [];
  if (!draftOrderRows.includes(gmId)) draftOrderRows.push(gmId);
  render();
}
function removeFromDraftOrder(idx) { draftOrderRows.splice(idx, 1); render(); }
function moveDraftOrder(idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= draftOrderRows.length) return;
  [draftOrderRows[idx], draftOrderRows[j]] = [draftOrderRows[j], draftOrderRows[idx]];
  render();
}

// ── Render ────────────────────────────────────────────────────
function gmName(id) {
  const g = state.gmsPublic.find(g => g.id === id);
  return g ? g.name : id;
}

function render() {
  const app = document.getElementById('app');

  // Polling re-renders the whole app on a timer, which would otherwise steal
  // focus and wipe out whatever the user is mid-typing. Snapshot the focused
  // field's value/selection and restore it after the DOM is rebuilt.
  const active = document.activeElement;
  let focused = null;
  if (active && active.id && app.contains(active) && 'value' in active) {
    focused = { id: active.id, value: active.value, selStart: active.selectionStart, selEnd: active.selectionEnd };
  }

  // Same problem as the focused-input case above, but for scroll position:
  // rebuilding #app's innerHTML resets any nested scrollable container back
  // to scrollTop 0. Scrolling doesn't count as "interacting with a form", so
  // the poll guard doesn't skip this render — without restoring it here, the
  // Available Players list snaps back to the top on every ~3s poll tick
  // while a GM is mid-scroll.
  const playerListEl = document.getElementById('player-list');
  const playerListScroll = playerListEl ? playerListEl.scrollTop : null;

  if (!state.role) { app.innerHTML = renderLanding(); attachLandingHandlers(); }
  else if (state.role === 'gm') { app.innerHTML = renderGmView(); attachGmHandlers(); }
  else if (state.role === 'commish') { app.innerHTML = renderCommishView(); attachCommishHandlers(); }

  if (focused) {
    const el = document.getElementById(focused.id);
    if (el && 'value' in el) {
      el.value = focused.value;
      el.focus();
      if (focused.selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(focused.selStart, focused.selEnd); } catch (e) {}
      }
    }
  }

  if (playerListScroll !== null) {
    const newPlayerListEl = document.getElementById('player-list');
    if (newPlayerListEl) newPlayerListEl.scrollTop = playerListScroll;
  }

  // The board modal lives outside #app (so it survives the innerHTML swap
  // above), which means nothing refreshes its content automatically — do it
  // here so every render() call (poll, pick, board edit) keeps it in sync
  // whenever it's actually open.
  const modalBg = document.getElementById('board-modal-bg');
  if (modalBg && modalBg.classList.contains('open')) renderBoardModalContent();
}

function renderGmView() {
  const ld = state.livedraft;

        <div class="meta">Round ${ld.round} · Pick ${ld.pickNumber} ${ld.status === 'paused' ? '· PAUSED' : ''}</div>

// Shared by the inline preview (top 5, no reorder/remove) and the full-board
// modal (everything) so the two never drift out of sync with each other.
function renderBoardRow(name, i, poolByName, picked, pickerOf, canDraftFromBoard, fullControls) {
  const p = poolByName[name];
  const isPicked = picked.has(name);
  const fmts = p ? [p.thu, p.fri, p.sat].filter(Boolean).join(' · ') : '';
  const status = isPicked ? `taken by ${gmName(pickerOf[name])}` : fmts;
  return `
    <div class="board-row ${isPicked ? 'taken' : ''}">
      <span class="board-rank">${i + 1}.</span>
      <div class="board-name-wrap">
        <div class="board-name">${name}</div>
        <div class="board-status">${status}</div>
      </div>
      ${(!isPicked && canDraftFromBoard) ? `<button class="btn btn-sm btn-primary board-draft-btn" data-name="${name.replace(/"/g, '&quot;')}" ${state.submitting ? 'disabled' : ''}>Draft</button>` : ''}
      ${fullControls ? `
        <button class="btn btn-sm" data-board-move="-1" data-idx="${i}">↑</button>
        <button class="btn btn-sm" data-board-move="1" data-idx="${i}">↓</button>
        <button class="btn btn-sm" data-board-remove="${i}">✕</button>
      ` : ''}
    </div>`;
}

function boardAddOptions() {
  const pool = state.playerPool || [];
  const onBoard = new Set(state.board || []);
  return pool.filter(p => !onBoard.has(p.name)).sort((a, b) => a.name.localeCompare(b.name));
}

const BOARD_PREVIEW_SIZE = 5;

function renderBoardPreview(picked, pickerOf, canDraftFromBoard) {
  const pool = state.playerPool || [];
  const poolByName = {};
  for (const p of pool) poolByName[p.name] = p;
  const board = state.board || [];
  const preview = board.slice(0, BOARD_PREVIEW_SIZE);

  const rows = preview.length ? preview.map((name, i) => renderBoardRow(name, i, poolByName, picked, pickerOf, canDraftFromBoard, false)).join('')
    : '<div class="hint">Your board is empty — add players below to start ranking them.</div>';

  return `
    <div class="card">
      <div class="card-title">My Draft Board <span style="color:var(--text-mute);font-weight:normal;text-transform:none;letter-spacing:0">(private — only you see this)</span></div>
      <div class="board-list">${rows}</div>
      ${board.length > BOARD_PREVIEW_SIZE ? `<div class="hint">+${board.length - BOARD_PREVIEW_SIZE} more on your board</div>` : ''}
      <div class="field" style="margin-top:12px">
        <select id="board-add-select">
          <option value="">Add player to board...</option>
          ${boardAddOptions().map(p => `<option value="${p.name.replace(/"/g, '&quot;')}">${p.name}</option>`).join('')}
        </select>
      </div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn btn-sm" id="see-full-board-btn">See Full Draft Board</button>
      </div>
    </div>`;
}

// Rendered into the static #board-modal-bg (outside #app, so it survives
// every #app innerHTML rebuild) rather than through the normal render()
// path — see the render()/isInteractingWithForm() notes for why.
function renderBoardModalContent() {
  const ld = state.livedraft;
  const picked = new Set(ld ? ld.picks.map(p => p.player) : []);
  const pickerOf = {};
  if (ld) for (const p of ld.picks) pickerOf[p.player] = p.gm;
  const canDraftFromBoard = !!ld && !ld.isComplete && ld.status === 'active' && ld.onTheClock === state.gmId;

  const pool = state.playerPool || [];
  const poolByName = {};
  for (const p of pool) poolByName[p.name] = p;
  const board = state.board || [];

  const rows = board.length ? board.map((name, i) => renderBoardRow(name, i, poolByName, picked, pickerOf, canDraftFromBoard, true)).join('')
    : '<div class="hint">Your board is empty — add players below to start ranking them.</div>';

  // This gets called on every ~3s poll tick while the modal is open (see
  // render()'s note above), and replacing innerHTML always resets a
  // scrollable container's scrollTop to 0 — with a long board, that reads
  // as the whole modal snapping back to the top mid-scroll every few
  // seconds. Snapshot both nested scroll containers (.modal-body itself and
  // .board-list inside it) and restore after rebuilding.
  const modalBody = document.getElementById('board-modal-body');
  const outerScroll = modalBody.scrollTop;
  const prevList = modalBody.querySelector('.board-list');
  const innerScroll = prevList ? prevList.scrollTop : 0;

  modalBody.innerHTML = `
    <div class="board-list">${rows}</div>
    <div class="field" style="margin-top:12px">
      <select id="board-modal-add-select">
        <option value="">Add player to board...</option>
        ${boardAddOptions().map(p => `<option value="${p.name.replace(/"/g, '&quot;')}">${p.name}</option>`).join('')}
      </select>
    </div>
  `;
  attachBoardModalHandlers();

  modalBody.scrollTop = outerScroll;
  const newList = modalBody.querySelector('.board-list');
  if (newList) newList.scrollTop = innerScroll;
}

function openBoardModal() {
  document.getElementById('board-modal-bg').classList.add('open');
  renderBoardModalContent();
}
function closeBoardModal() {
  document.getElementById('board-modal-bg').classList.remove('open');
}
function attachBoardModalHandlers() {
  const boardAdd = document.getElementById('board-modal-add-select');
  if (boardAdd) boardAdd.onchange = () => { if (boardAdd.value) addToBoard(boardAdd.value); };
  document.querySelectorAll('#board-modal-body [data-board-move]').forEach(btn => {
    btn.onclick = () => moveBoard(parseInt(btn.dataset.idx), parseInt(btn.dataset.boardMove));
  });
  document.querySelectorAll('#board-modal-body [data-board-remove]').forEach(btn => {
    btn.onclick = () => removeFromBoard(parseInt(btn.dataset.boardRemove));
  });
  document.querySelectorAll('#board-modal-body .board-draft-btn').forEach(btn => {
    btn.onclick = () => submitPick(btn.dataset.name);

function renderPlayerRows(list, filter) {
  const f = (filter || '').toLowerCase();
  const filtered = f ? list.filter(p => p.name.toLowerCase().includes(f)) : list;
  if (!filtered.length) return '<div class="hint" style="padding:14px">No players match.</div>';
  return filtered.map(p => `
    <div class="player-row">
      <div><div class="player-name">${p.name}</div><div class="player-fmts">${[p.thu,p.fri,p.sat].filter(Boolean).join(' · ') || ''}</div></div>

function renderFeed(picks) {
  if (!picks.length) return '<div class="hint">No picks yet.</div>';
  return [...picks].reverse().map(p => `

function renderLogout() {

          ${state.gmsPublic.map(g => `<option value="${g.id}">${g.name}</option>`).join('')}
        </select>
        <div id="order-list" style="margin-top:8px">
          ${draftOrderRows.map((id, i) => `
            <div class="roster-order-item">
              <span class="pos">${i+1}.</span>
              <span style="flex:1">${gmName(id)}</span>
              <button class="btn btn-sm" data-move="-1" data-idx="${i}">↑</button>
              <button class="btn btn-sm" data-move="1" data-idx="${i}">↓</button>
              <button class="btn btn-sm" data-remove="${i}">✕</button>
            </div>`).join('')}
        </div>
      </div>
      <button class="btn btn-primary" id="start-draft-btn">Start Draft</button>
      <div class="error-msg" id="start-error"></div>
    </div>
  `;
}

function renderGmRegistryPanel() {
  return `
    <div class="card">
      <div class="card-title">GM Roster &amp; Tokens</div>
      ${commishGmRows === null
        ? `<button class="btn" id="load-gms-btn">Load GM Roster</button>`
        : `
          <div id="gm-rows">${commishGmRows.map((r, i) => `
            <div class="gm-editor-row">
              <input type="text" id="gm-id-${i}" placeholder="id (e.g. josh)" value="${r.id}">
              <input type="text" id="gm-name-${i}" placeholder="Display name" value="${r.name}">
              <button class="btn btn-sm" data-remove-gm="${i}">✕</button>
            </div>
            <div class="gm-editor-row">
              <input type="text" id="gm-username-${i}" placeholder="Username (for password login)" value="${r.username || ''}">
            </div>
            <div class="token-link-row">
              <div class="token-link" id="gm-link-${i}">${gmLinkFor(r)}</div>
              <button class="btn btn-sm" data-copy-link="${i}" ${r.id ? '' : 'disabled title="Enter an id first"'}>Copy</button>
            </div>
            <div class="token-link-row">
              <div class="token-link" style="color:var(--text-mute)">${r.hasPassword ? 'Password is set' : 'No password set yet'}</div>
              <button class="btn btn-sm" data-reset-pw="${i}">Reset Password</button>
            </div>
            ${r.revealedPassword ? `
              <div class="pw-reveal-row">
                <div class="pw-text">New password: <strong id="gm-revealed-pw-${i}">${r.revealedPassword}</strong></div>
                <button class="btn btn-sm" data-copy-pw="${i}">Copy</button>
                <button class="btn btn-sm" data-hide-pw="${i}">Hide</button>
              </div>
            ` : ''}
          `).join('')}</div>
          <div class="btn-row">
            <button class="btn btn-sm" id="add-gm-btn">+ Add GM</button>
            <button class="btn btn-sm btn-primary" id="save-gms-btn">Save Roster</button>
          </div>
          <div class="hint">Click "Save Roster" first, then send each GM their link above — it logs them in automatically.</div>
          <div class="error-msg" id="gm-editor-error"></div>
        `}
    </div>
  `;
}

function renderPlayerPoolPanel() {
  return `
    <div class="card">
      <div class="card-title">Player Pool</div>
      <div class="field"><label>Year</label><input type="text" id="pool-year" value="${state.year}"></div>
      <div class="field"><label>Players (JSON array, e.g. from scouting.html's PLAYERS list)</label>
        <textarea id="pool-json" placeholder='[{"name":"Player Name","thu":"BD","fri":"T1","sat":"Teams"}]'></textarea>
      </div>
      <button class="btn" id="save-pool-btn">Save Player Pool</button>
      <div class="hint" id="pool-error"></div>
    </div>
  `;
}

function attachCommishHandlers() {
  const pause = document.getElementById('pause-btn'); if (pause) pause.onclick = pauseDraft;
  const resume = document.getElementById('resume-btn'); if (resume) resume.onclick = resumeDraft;
  const undo = document.getElementById('undo-btn'); if (undo) undo.onclick = undoPick;
  const reset = document.getElementById('reset-draft-btn'); if (reset) reset.onclick = resetDraft;
  const finalize = document.getElementById('finalize-draft-btn'); if (finalize) finalize.onclick = finalizeDraft;

  const startBtn = document.getElementById('start-draft-btn'); if (startBtn) startBtn.onclick = startDraft;
  const addOrder = document.getElementById('add-order-select');
  if (addOrder) addOrder.onchange = () => { if (addOrder.value) addToDraftOrder(addOrder.value); };
  document.querySelectorAll('[data-move]').forEach(btn => {
    btn.onclick = () => moveDraftOrder(parseInt(btn.dataset.idx), parseInt(btn.dataset.move));
  });
  document.querySelectorAll('[data-remove]').forEach(btn => {
    btn.onclick = () => removeFromDraftOrder(parseInt(btn.dataset.remove));
  });

  const loadGms = document.getElementById('load-gms-btn'); if (loadGms) loadGms.onclick = loadGmEditor;
  const addGm = document.getElementById('add-gm-btn'); if (addGm) addGm.onclick = addGmRow;
  const saveGms = document.getElementById('save-gms-btn'); if (saveGms) saveGms.onclick = saveGmRows;
  document.querySelectorAll('[data-remove-gm]').forEach(btn => {
    btn.onclick = () => removeGmRow(parseInt(btn.dataset.removeGm));
  });
  if (commishGmRows) {
    commishGmRows.forEach((r, i) => {
      const idInp = document.getElementById('gm-id-'+i);
      const nameInp = document.getElementById('gm-name-'+i);
      const usernameInp = document.getElementById('gm-username-'+i);
      if (idInp) idInp.oninput = () => { r.id = idInp.value; refreshGmLinkRow(i); };
      if (nameInp) nameInp.oninput = () => { r.name = nameInp.value; };
      // Without this, any render() triggered by another action (add/remove a
      // row, reset a password, even a poll) rebuilds this input from the
      // stale in-memory r.username and silently discards whatever was typed
      // but not yet saved — exactly the bug id/name already avoid above.
      if (usernameInp) usernameInp.oninput = () => { r.username = usernameInp.value; };
    });
    document.querySelectorAll('[data-copy-link]').forEach(btn => {
      btn.onclick = () => copyGmLink(parseInt(btn.dataset.copyLink), btn);
    });
    document.querySelectorAll('[data-reset-pw]').forEach(btn => {
      btn.onclick = () => resetGmPassword(parseInt(btn.dataset.resetPw));
    });
    document.querySelectorAll('[data-copy-pw]').forEach(btn => {
      btn.onclick = () => copyGmPassword(parseInt(btn.dataset.copyPw), btn);
    });
    document.querySelectorAll('[data-hide-pw]').forEach(btn => {
      btn.onclick = () => hideGmPassword(parseInt(btn.dataset.hidePw));
    });
  }

  const savePool = document.getElementById('save-pool-btn'); if (savePool) savePool.onclick = savePlayerPool;

  const logout = document.getElementById('logout-link'); if (logout) logout.onclick = clearSession;
}

init();
</script>
</body>
</html>
