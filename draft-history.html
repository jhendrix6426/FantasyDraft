<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft History — Fantasy Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080a;
  --panel: #131317;
  --panel-2: #1a1a20;
  --border: #26262e;
  --border-soft: #1c1c22;
  --red: #ff3450;
  --red-dim: #7a1424;
  --gold: #dab35e;
  --gold-bright: #f0d391;
  --text: #eaeaef;
  --text-dim: #8b8b98;
  --text-mute: #4d4d58;
  --cyan: #3ec7ff;
  --green: #35d488;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scrollbar-color: var(--border) var(--bg); }
body {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  background:
    radial-gradient(ellipse 900px 500px at 12% -10%, rgba(255,52,80,0.14), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(218,179,94,0.10), transparent 55%),
    var(--bg);
  color: var(--text);
  font-size: 13px;
  min-height: 100vh;
  padding-bottom: 40px;
}
.page { max-width: 1480px; margin: 0 auto; padding: 0 24px; }

.hero { padding: 28px 4px 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.hero-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: 3px; color: var(--red);
  background: rgba(255,52,80,0.1); border: 1px solid var(--red-dim);
  padding: 4px 10px; border-radius: 100px; margin-bottom: 10px;
}
.hero-tag::before { content:''; width:6px; height:6px; border-radius:50%; background: var(--red); box-shadow: 0 0 8px var(--red); }
h1 {
  font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; font-size: 28px; line-height: 1.1; margin-bottom: 8px;
  background: linear-gradient(100deg, var(--gold-bright), var(--gold) 55%, var(--red));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.status {
  display: inline-block; color: var(--text-dim); font-size: 11px;
  padding: 5px 12px; background: var(--panel); border: 1px solid var(--border-soft);
  border-radius: 100px;
}

.card {
  background: var(--panel); border: 1px solid var(--border-soft); border-radius: 10px;
  padding: 18px 20px; margin-bottom: 16px; position: relative; overflow: hidden;
}
.card::before {
  content: ''; display: block; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--red), var(--gold) 50%, var(--red));
}
.card-title {
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: 2px; color: var(--gold); margin-bottom: 14px;
}
.hint { color: var(--text-mute); font-size: 11px; margin-top: 6px; line-height: 1.5; }

/* ── Year grid ── */
.year-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.year-card {
  background: var(--panel); border: 1px solid var(--border-soft); border-radius: 10px;
  padding: 20px; cursor: pointer; position: relative; overflow: hidden;
  transition: border-color .15s, transform .15s;
}
.year-card::before {
  content: ''; display: block; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--red), var(--gold) 50%, var(--red));
}
.year-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.year-card .yr {
  font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 30px; line-height: 1;
  background: linear-gradient(100deg, var(--gold-bright), var(--gold) 55%, var(--red));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  margin-bottom: 10px;
}
.year-card .champ-label {
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 10px;
  text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-mute); margin-bottom: 3px;
}
.year-card .champ-name { font-weight: 600; color: var(--gold-bright); margin-bottom: 10px; }
.year-card .meta { color: var(--text-dim); font-size: 11px; }

/* ── Detail view ── */
.back-link {
  display: inline-block; cursor: pointer; color: var(--text-mute); font-size: 11px;
  text-decoration: underline; margin-bottom: 16px;
}
.back-link:hover { color: var(--text); }
.champ-banner {
  border-radius: 10px; padding: 20px; margin-bottom: 16px; text-align: center;
  border: 1px solid var(--gold); background: linear-gradient(120deg, rgba(218,179,94,0.16), var(--panel-2));
  box-shadow: 0 0 24px rgba(218,179,94,0.12);
}
.champ-banner .yr-label {
  font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 4px;
}
.champ-banner .champ {
  font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px;
  text-transform: uppercase; letter-spacing: 1px; color: var(--gold-bright);
}
.champ-banner .champ-pts { color: var(--text-dim); font-size: 11px; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

.standings-row {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  border-bottom: 1px solid var(--border-soft); cursor: pointer;
}
.standings-row:last-child { border-bottom: none; }
.standings-row:hover { background: rgba(255,255,255,0.02); }
.standings-row .rank { width: 22px; color: var(--gold); font-weight: 700; }
.standings-row .gm-name { flex: 1; font-weight: 600; }
.standings-row .gm-pts { color: var(--gold-bright); font-weight: 600; }
.standings-row .chevron { color: var(--text-mute); transition: transform .15s; width: 14px; text-align: center; }
.standings-row.expanded .chevron { transform: rotate(90deg); }

.roster-detail { padding: 2px 14px 14px 46px; border-bottom: 1px solid var(--border-soft); }
.roster-player-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 7px 0; font-size: 12px; gap: 10px;
}
.roster-player-row .pname { font-weight: 600; }
.roster-player-row .pick-badge { color: var(--text-mute); font-size: 10px; margin-right: 8px; }
.roster-player-row .ppts { color: var(--gold-bright); flex-shrink: 0; }
.player-breakdown { color: var(--text-dim); font-size: 10px; margin-top: 2px; }

.round-block { margin-bottom: 14px; }
.round-block:last-child { margin-bottom: 0; }
.round-title {
  font-family: 'Oswald', sans-serif; font-size: 10px; text-transform: uppercase;
  color: var(--gold); letter-spacing: 1.5px; margin-bottom: 8px;
}
.round-picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick-chip {
  background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 6px;
  padding: 7px 10px; font-size: 11px; min-width: 140px;
}
.pick-chip .pick-num { color: var(--text-mute); }
.pick-chip .pick-player { font-weight: 600; }
.pick-chip .pick-gm {
  color: var(--cyan); font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
  display: block; margin-top: 3px;
}

/* ── Clickable player names ── */
.player-link {
  background: none; border: none; padding: 0; cursor: pointer;
  font: inherit; color: inherit; text-decoration: underline dotted; text-underline-offset: 2px;
}
.player-link:hover { color: var(--gold-bright); }

/* ── Year navigation arrows ── */
.year-nav-row { display: contents; }
.nav-arrow {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--panel); border: 1px solid var(--border-soft);
  color: var(--text-dim); display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer; z-index: 50;
  transition: border-color .15s, color .15s;
}
.nav-arrow:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-bright); }
.nav-arrow:disabled { opacity: .2; cursor: default; }
.nav-arrow.prev { left: 20px; }
.nav-arrow.next { right: 20px; }
@media (max-width: 820px) {
  .year-nav-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
  .nav-arrow { position: static; transform: none; width: auto; height: auto; border-radius: 100px; padding: 8px 16px; font-size: 14px; }
}

/* ── Format badges (matches scouting.html) ── */
.fmt-tag {
  display: inline-block; padding: 3px 8px; border-radius: 100px; font-size: 10px;
  font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
}
.fmt-T1 { background: rgba(62,199,255,0.12); color: var(--cyan); border: 1px solid rgba(62,199,255,0.35); }
.fmt-T2 { background: rgba(255,52,80,0.12); color: #ff8a9b; border: 1px solid rgba(255,52,80,0.35); }
.fmt-BD { background: rgba(53,212,136,0.12); color: var(--green); border: 1px solid rgba(53,212,136,0.35); }
.fmt-SD { background: rgba(218,179,94,0.14); color: var(--gold-bright); border: 1px solid rgba(218,179,94,0.4); }
.fmt-Teams { background: rgba(190,110,255,0.12); color: #c295ff; border: 1px solid rgba(190,110,255,0.35); }
.fmt-TA { background: rgba(255,140,60,0.12); color: #ffab6b; border: 1px solid rgba(255,140,60,0.35); }
.pool-avg { color: var(--text-dim); }
.record-badge { cursor: help; font-size: 11px; }

/* ── Player profile modal ── */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(4,4,6,.88); backdrop-filter: blur(2px); z-index: 1000; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 20px; }
.modal-bg.open { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 720px; margin: auto; padding: 0; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.modal-head {
  background: linear-gradient(120deg, rgba(255,52,80,0.16), var(--panel-2) 60%);
  padding: 18px 22px; border-bottom: 1px solid var(--border); border-top: 3px solid var(--red);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.modal-name { color: var(--text); font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.modal-meta { color: var(--text-dim); font-size: 11px; margin-top: 5px; }
.modal-close {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); padding: 5px 12px;
  cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 11px; flex-shrink: 0; border-radius: 100px;
  transition: color .15s, border-color .15s;
}
.modal-close:hover { color: var(--red); border-color: var(--red); }
.modal-body { padding: 18px 22px; }
.modal-section { margin-bottom: 22px; }
.modal-section:last-child { margin-bottom: 0; }
.modal-sec-title {
  color: var(--gold); font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1.5px; padding-bottom: 8px; margin-bottom: 12px;
  border-bottom: 1px solid var(--border); position: relative; padding-left: 12px;
}
.modal-sec-title::before { content:''; position:absolute; left:0; top:2px; bottom:8px; width:3px; background: var(--red); border-radius: 2px; }
.modal-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.modal-tbl th { text-align: left; padding: 6px 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-mute); border-bottom: 1px solid var(--border); font-weight: 500; font-family: 'Oswald', sans-serif; }
.modal-tbl td { padding: 6px 8px; border-bottom: 1px solid var(--border-soft); }
.modal-tbl .r { text-align: right; }
.modal-tbl .c { text-align: center; }
.pct-high { color: var(--cyan); }
.pct-mid { color: var(--gold); }
.pct-low { color: var(--red); }
.dvs-pos { color: var(--cyan); }
.dvs-neg { color: var(--red); }
.dvs-neu { color: var(--text-dim); }
.no-data-msg { color: var(--text-mute); font-size: 12px; padding: 8px 0; }
.pm-record-line { padding: 5px 0; font-size: 12px; }

.category-row { cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; }
.category-row:hover { color: var(--gold-bright); }
.category-row .chevron-toggle { color: var(--text-mute); transition: transform .15s; display: inline-block; }
.category-row.open .chevron-toggle { transform: rotate(90deg); }
.collapsible-body { display: none; padding: 2px 0 8px 18px; }
.collapsible-body.open { display: block; }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="hero-tag">Draft History</div>
    <h1 id="page-title">Past Fantasy Drafts</h1>
    <div class="status" id="status">Loading...</div>
  </header>
  <div id="app"></div>
</div>

<div class="modal-bg" id="player-modal" onclick="if(event.target===this)closePlayerModal()">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-name" id="pm-name">—</div>
        <div class="modal-meta" id="pm-meta">—</div>
      </div>
      <button class="modal-close" onclick="closePlayerModal()">Close ✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <div class="modal-sec-title">Fantasy Draft</div>
        <div id="pm-draft"></div>
      </div>
      <div class="modal-section">
        <div class="modal-sec-title">Match Record</div>
        <div id="pm-record"></div>
      </div>
      <div class="modal-section">
        <div class="modal-sec-title">Daily Points vs. Pool Average</div>
        <div id="pm-daily"></div>
      </div>
      <div class="modal-section">
        <div class="modal-sec-title">Head-to-Head</div>
        <div id="pm-h2h"></div>
      </div>
    </div>
  </div>
</div>

<script src="records.js"></script>
<script src="fantasy-history.js"></script>
<script>
const API = 'https://nationals-history.jhendrix6426.workers.dev/nationals/db';
const FANTASY_API_BASE = 'https://fantasy-draft.jhendrix6426.workers.dev';
// Bump each year once that year's draft is running in live-draft.html — this
// is the one year mergeWorkerDraftHistory/reconcileWithOfficialResults pull
// from the fantasy-draft Worker instead of nationals-history's hardcoded data.
const FANTASY_DRAFT_YEAR = 2026;
let recordsBook = null;
function badgeHtml(labels) {
  if (!labels.length) return '';
  const title = labels.join(' · ').replace(/"/g, '&quot;');
  return ` <span class="record-badge" title="${title}">🏆${labels.length > 1 ? '×' + labels.length : ''}</span>`;
}
const FMT_MAP = {
  'T1 2-Player':'T1','T2 2-Player':'T2','Booster Draft':'BD',
  'Sealed':'SD','Teams':'Teams','Type A':'TA','Booster Draft (Multi)':'BD'
};
const FMT_LABEL = {T1:'Type 1',T2:'Type 2',BD:'Booster',SD:'Sealed',Teams:'Teams',TA:'Type A'};
const FMT_TO_DAY = {BD:'thu',T2:'thu',T1:'fri',TA:'fri',SD:'sat',Teams:'sat'};
const DAY_LABEL = {thu:'Thu',fri:'Fri',sat:'Sat'};

let DD = {};
let RAW_DB = null;
const state = { view: 'years', year: null, expanded: new Set() };

function avg(arr) { return arr.length ? arr.reduce((s,v)=>s+v,0)/arr.length : null; }
function r1(n) { return n!==null && n!==undefined ? Math.round(n*10)/10 : null; }
function fmtTag(f) { return `<span class="fmt-tag fmt-${f}">${FMT_LABEL[f]||f}</span>`; }
// A breakdown entry flagged verified:false disagrees with the official-results
// recompute (see fantasy-history.js) — shown with a ⚠ and both values rather
// than silently trusting either one, so the discrepancy stays visible until
// resolved by hand.
function breakdownEntryHtml(b) {
  if (b.verified === false) {
    return `<span style="color:var(--red)" title="Hand-entered: ${b.pts} · Official recompute: ${b.officialPts} — these disagree and need manual review">⚠ ${b.format}: ${b.pts}</span>`;
  }
  return `${b.format}: ${b.pts}`;
}

function normName(n) {
  return n.toLowerCase().trim().replace(/\s+/g,' ')
    .replace(/\bmitch\b/,'mitchell')
    .replace(/jayden alstand/,'jayden alstad')
    .replace(/dario dante villanova/,'dario dante villanova')
    .replace(/^dario villanova$/,'dario dante villanova');
}
function namesMatch(a,b) {
  const na=normName(a), nb=normName(b);
  if(na===nb) return true;
  const pa=na.split(' '), pb=nb.split(' ');
  if(pa.length<2 || pb.length<2) return false;
  if(pa[pa.length-1] !== pb[pb.length-1]) return false;
  const fa=pa[0], fb=pb[0];
  return fa===fb || fa.startsWith(fb) || fb.startsWith(fa);
}

// ── Single-season player queries (Match Record / Daily Points / Head-to-Head) ──
function getYearResults(playerName, year) {
  const out = [];
  if (!RAW_DB || !RAW_DB.results) return out;
  for (const [key, results] of Object.entries(RAW_DB.results)) {
    if (parseInt(key.split('_')[0]) !== year) continue;
    const fmt = FMT_MAP[key.split('_').slice(1).join('_')];
    if (!fmt) continue;
    const day = FMT_TO_DAY[fmt];
    for (const r of results) {
      if (!namesMatch(r.playerName, playerName) || !r.notes) continue;
      const m = r.notes.match(/([\d.]+)pts/);
      if (!m) continue;
      out.push({ fmt, day, pts: parseFloat(m[1]), placement: r.placement, fieldSize: results.length });
    }
  }
  return out;
}
function getYearPoolAvg(year, day) {
  const pts = [];
  if (!RAW_DB || !RAW_DB.results) return null;
  for (const [key, results] of Object.entries(RAW_DB.results)) {
    if (parseInt(key.split('_')[0]) !== year) continue;
    const fmt = FMT_MAP[key.split('_').slice(1).join('_')];
    if (!fmt || FMT_TO_DAY[fmt] !== day) continue;
    for (const r of results) {
      if (!r.notes) continue;
      const m = r.notes.match(/([\d.]+)pts/);
      if (m) pts.push(parseFloat(m[1]));
    }
  }
  return pts.length ? r1(avg(pts)) : null;
}
function getYearMatches(playerName, year) {
  const out = [];
  if (!RAW_DB || !RAW_DB.matches) return out;
  for (const [key, matchList] of Object.entries(RAW_DB.matches)) {
    if (parseInt(key.split('_')[0]) !== year) continue;
    const fmt = FMT_MAP[key.split('_').slice(1).join('_')];
    if (!fmt) continue;
    for (const m of matchList) {
      if (!m.playerA || !m.playerB || !m.winner) continue;
      if (namesMatch(m.playerA, playerName)) out.push({ fmt, opp: m.playerB, scoreFor: m.scoreA, scoreAgainst: m.scoreB, win: m.playerA === m.winner, round: m.round });
      else if (namesMatch(m.playerB, playerName)) out.push({ fmt, opp: m.playerA, scoreFor: m.scoreB, scoreAgainst: m.scoreA, win: m.playerB === m.winner, round: m.round });
    }
  }
  return out;
}

function processFantasyDraft(db) {
  if (!db || !db.tournaments) return;
  for (const t of db.tournaments) {
    if (!t.fantasyDraft || !t.fantasyDraft.teams || !t.fantasyDraft.teams.length) continue;
    const teams = t.fantasyDraft.teams.map(team => ({
      gm: team.gm,
      pts: team.pts,
      players: team.players.map(p => ({ name: p.name, pts: p.pts, pick: p.draftPick, breakdown: p.breakdown || [] }))
    }));
    const champion = teams.reduce((best, tm) => tm.pts > best.pts ? tm : best, teams[0]).gm;
    DD[t.year] = { champion, teams };
  }
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// ── Year navigation ──
function sortedYears() { return Object.keys(DD).map(Number).sort((a, b) => a - b); }
function gotoYear(y) {
  if (!DD[y]) return;
  state.year = y;
  state.expanded.clear();
  history.replaceState(null, '', `?year=${y}`);
  render();
}
// Year cards render newest-first (left to right), so the left arrow should
// feel like it moves toward the start of that row (newer) and the right
// arrow toward the end (older) — the reverse of a plain chronological prev/next.
function gotoOlderYear() {
  const years = sortedYears();
  const idx = years.indexOf(state.year);
  if (idx > 0) gotoYear(years[idx - 1]);
}
function gotoNewerYear() {
  const years = sortedYears();
  const idx = years.indexOf(state.year);
  if (idx >= 0 && idx < years.length - 1) gotoYear(years[idx + 1]);
}

// ── Single-season player profile modal ──
function openPlayerModal(name, year) {
  document.getElementById('pm-name').textContent = name;
  document.getElementById('pm-meta').textContent = `${year} Nationals — single-season profile`;

  const matches = getYearMatches(name, year);
  const results = getYearResults(name, year);

  // Fantasy draft context for this year
  const d = DD[year];
  let draftHtml = '<div class="no-data-msg">No draft data.</div>';
  for (const team of d.teams) {
    const pick = team.players.find(pk => namesMatch(pk.name, name));
    if (!pick) continue;
    draftHtml = `<div class="pm-record-line">Drafted <strong>#${pick.pick}</strong> overall by <strong>${team.gm}</strong>${d.champion === team.gm ? ' <span style="color:var(--gold-bright)">★ champion</span>' : ''} — scored <strong>${pick.pts}</strong> pts${pick.breakdown && pick.breakdown.length ? ` <span class="pool-avg">(${pick.breakdown.map(breakdownEntryHtml).join(' · ')})</span>` : ''}</div>`;
    break;
  }
  document.getElementById('pm-draft').innerHTML = draftHtml;

  // Overall + by-format match record (each format collapses its match-by-match listing)
  let recordHtml;
  if (matches.length) {
    const wins = matches.filter(m => m.win).length;
    recordHtml = `<div class="pm-record-line">Overall: <strong>${wins}-${matches.length - wins}</strong> <span class="pool-avg">(${Math.round(wins / matches.length * 100)}%)</span></div>`;
    const byFmt = {};
    for (const m of matches) (byFmt[m.fmt] = byFmt[m.fmt] || []).push(m);
    for (const [fmt, ms] of Object.entries(byFmt)) {
      const w = ms.filter(m => m.win).length;
      const detailId = `pm-match-detail-${fmt}`;
      recordHtml += `
        <div class="category-row" onclick="toggleEl('${detailId}', this)">
          <span class="chevron-toggle">›</span>
          ${fmtTag(fmt)} <strong>${w}-${ms.length - w}</strong> <span class="pool-avg">(${Math.round(w / ms.length * 100)}%)</span>
        </div>
        <div class="collapsible-body" id="${detailId}">
          <table class="modal-tbl">
            <thead><tr><th>Round</th><th>Opponent</th><th class="r">Score</th><th class="c">Result</th></tr></thead>
            <tbody>${ms.map(m => `<tr>
              <td>${m.round || '—'}</td>
              <td>${m.opp}</td>
              <td class="r">${m.scoreFor}-${m.scoreAgainst}</td>
              <td class="c"><span class="${m.win ? 'pct-high' : 'pct-low'}">${m.win ? 'W' : 'L'}</span></td>
            </tr>`).join('')}</tbody>
          </table>
        </div>`;
    }
  } else {
    recordHtml = `<div class="no-data-msg">No match data for ${year}.</div>`;
  }
  document.getElementById('pm-record').innerHTML = recordHtml;

  // Daily points vs pool average
  let dailyHtml;
  if (results.length) {
    dailyHtml = `<table class="modal-tbl">
      <thead><tr><th>Day</th><th>Format</th><th class="r">Pts</th><th class="r">Pool Avg</th><th class="r">Diff</th><th class="r">Placement</th><th class="r">%ile</th></tr></thead>
      <tbody>${results.map(r => {
        const poolAvg = getYearPoolAvg(year, r.day);
        const diff = poolAvg !== null ? r1(r.pts - poolAvg) : null;
        const diffCls = diff === null ? '' : diff > 0 ? 'dvs-pos' : diff < 0 ? 'dvs-neg' : 'dvs-neu';
        const pct = r.fieldSize ? Math.round(((r.fieldSize - r.placement + 1) / r.fieldSize) * 100) : null;
        const pctCls = pct >= 80 ? 'pct-high' : pct >= 50 ? 'pct-mid' : 'pct-low';
        return `<tr>
          <td>${DAY_LABEL[r.day] || r.day}</td>
          <td>${fmtTag(r.fmt)}</td>
          <td class="r"><strong>${r.pts}</strong></td>
          <td class="r">${poolAvg ?? '—'}</td>
          <td class="r">${diff !== null ? `<span class="${diffCls}">${diff > 0 ? '+' : ''}${diff}</span>` : '—'}</td>
          <td class="r">#${r.placement} / ${r.fieldSize}</td>
          <td class="r">${pct !== null ? `<span class="${pctCls}">${pct}%</span>` : '—'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  } else {
    dailyHtml = `<div class="no-data-msg">No Nationals results for ${year}.</div>`;
  }
  document.getElementById('pm-daily').innerHTML = dailyHtml;

  // Head-to-head
  const h2h = {};
  for (const m of matches) {
    if (!h2h[m.opp]) h2h[m.opp] = { w: 0, l: 0 };
    if (m.win) h2h[m.opp].w++; else h2h[m.opp].l++;
  }
  const h2hEntries = Object.entries(h2h).sort((a, b) => (b[1].w + b[1].l) - (a[1].w + a[1].l));
  const h2hHtml = h2hEntries.length ? `
      <div class="category-row" onclick="toggleEl('pm-h2h-detail', this)">
        <span class="chevron-toggle">›</span>
        ${h2hEntries.length} opponent${h2hEntries.length !== 1 ? 's' : ''} faced
      </div>
      <div class="collapsible-body" id="pm-h2h-detail">
        <table class="modal-tbl">
          <thead><tr><th>Opponent</th><th class="r">Record</th></tr></thead>
          <tbody>${h2hEntries.map(([opp, rec]) => `<tr><td>${opp}</td><td class="r"><span class="${rec.w > rec.l ? 'pct-high' : rec.w < rec.l ? 'pct-low' : 'pct-mid'}">${rec.w}-${rec.l}</span></td></tr>`).join('')}</tbody>
        </table>
      </div>` : `<div class="no-data-msg">No head-to-head data for ${year}.</div>`;
  document.getElementById('pm-h2h').innerHTML = h2hHtml;

  document.getElementById('player-modal').classList.add('open');
}
function closePlayerModal() { document.getElementById('player-modal').classList.remove('open'); }

function toggleEl(id, headerEl) {
  const el = document.getElementById(id);
  if (!el) return;
  const opening = !el.classList.contains('open');
  el.classList.toggle('open', opening);
  if (headerEl) headerEl.classList.toggle('open', opening);
}

async function init() {
  setStatus('Loading...');
  try {
    const db = await fetch(API).then(r => r.json());
    await FantasyHistory.mergeWorkerDraftHistory(db, FANTASY_DRAFT_YEAR, FANTASY_API_BASE);
    FantasyHistory.reconcileWithOfficialResults(db, FANTASY_DRAFT_YEAR);
    RAW_DB = db;
    processFantasyDraft(db);
    recordsBook = RecordsBook.compute(db);
  } catch (e) {
    setStatus('Could not load draft history: ' + e.message);
    render();
    return;
  }
  const years = Object.keys(DD);
  if (!years.length) { setStatus('No completed drafts yet.'); render(); return; }

  const params = new URLSearchParams(location.search);
  const y = parseInt(params.get('year'));
  if (y && DD[y]) { state.view = 'detail'; state.year = y; }

  setStatus(`${years.length} draft${years.length === 1 ? '' : 's'} on record`);
  render();
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = state.view === 'years' ? renderYears() : renderDetail(state.year);
  attachHandlers();
}

function renderYears() {
  const years = Object.keys(DD).map(Number).sort((a, b) => b - a);
  const cards = years.map(yr => {
    const d = DD[yr];
    const champTeam = d.teams.find(t => t.gm === d.champion);
    return `
      <div class="year-card" data-year="${yr}">
        <div class="yr">${yr}</div>
        <div class="champ-label">Champion</div>
        <div class="champ-name">${d.champion}</div>
        <div class="meta">${champTeam.pts} pts · ${d.teams.length} GMs</div>
      </div>`;
  }).join('');
  return `<div class="year-grid">${cards}</div>`;
}

function renderDetail(year) {
  const d = DD[year];
  const teamCount = d.teams.length;
  const standings = [...d.teams].sort((a, b) => b.pts - a.pts);
  const champTeam = standings[0];

  const standingsHtml = standings.map((team, i) => {
    const expanded = state.expanded.has(team.gm);
    const roster = [...team.players].sort((a, b) => a.pick - b.pick);
    return `
      <div class="standings-row ${expanded ? 'expanded' : ''}" data-gm="${team.gm.replace(/"/g, '&quot;')}">
        <span class="rank">${i + 1}.</span>
        <span class="gm-name">${team.gm}${recordsBook ? badgeHtml(RecordsBook.badgesForTeam(recordsBook, team.gm, year)) : ''}</span>
        <span class="gm-pts">${team.pts} pts</span>
        <span class="chevron">›</span>
      </div>
      ${expanded ? `
        <div class="roster-detail">
          ${roster.map(p => `
            <div class="roster-player-row">
              <div><span class="pick-badge">Pick ${p.pick}</span><button class="player-link pname" data-name="${p.name.replace(/"/g, '&quot;')}">${p.name}</button>${recordsBook ? badgeHtml(RecordsBook.badgesForPlayerYear(recordsBook, p.name, year)) : ''}
                ${p.breakdown.length ? `<div class="player-breakdown">${p.breakdown.map(breakdownEntryHtml).join(' · ')}</div>` : ''}
              </div>
              <span class="ppts">${p.pts} pts</span>
            </div>`).join('')}
        </div>` : ''}
    `;
  }).join('');

  const allPicks = d.teams.flatMap(team => team.players.map(p => ({ ...p, gm: team.gm })))
    .sort((a, b) => a.pick - b.pick);
  const rounds = {};
  for (const p of allPicks) {
    const round = Math.ceil(p.pick / teamCount);
    (rounds[round] = rounds[round] || []).push(p);
  }
  const roundsHtml = Object.keys(rounds).map(Number).sort((a, b) => a - b).map(round => `
    <div class="round-block">
      <div class="round-title">Round ${round}</div>
      <div class="round-picks">
        ${rounds[round].map(p => `
          <div class="pick-chip">
            <span class="pick-num">#${p.pick}</span> <button class="player-link pick-player" data-name="${p.name.replace(/"/g, '&quot;')}">${p.name}</button>${recordsBook ? badgeHtml(RecordsBook.badgesForPlayerYear(recordsBook, p.name, year)) : ''}
            <span class="pick-gm">${p.gm}</span>
          </div>`).join('')}
      </div>
    </div>
  `).join('');

  const years = sortedYears();
  const idx = years.indexOf(year);
  const newerYear = idx < years.length - 1 ? years[idx + 1] : null;
  const olderYear = idx > 0 ? years[idx - 1] : null;

  return `
    <div class="year-nav-row">
      <button class="nav-arrow prev" id="prev-year-btn" ${newerYear ? `title="${newerYear}"` : 'disabled'}>‹</button>
      <button class="nav-arrow next" id="next-year-btn" ${olderYear ? `title="${olderYear}"` : 'disabled'}>›</button>
    </div>
    <span class="back-link" id="back-link">← All Years</span>
    <div class="champ-banner">
      <div class="yr-label">${year} Fantasy Draft</div>
      <div class="champ">🏆 ${d.champion}</div>
      <div class="champ-pts">${champTeam.pts} points</div>
    </div>
    <div class="card">
      <div class="card-title">Final Standings</div>
      ${standingsHtml}
      <div class="hint">Click a GM to see their full roster.</div>
    </div>
    <div class="card">
      <div class="card-title">Draft Order</div>
      ${roundsHtml}
    </div>
  `;
}

function attachHandlers() {
  document.querySelectorAll('.year-card').forEach(card => {
    card.onclick = () => {
      state.view = 'detail';
      gotoYear(parseInt(card.dataset.year));
    };
  });
  const back = document.getElementById('back-link');
  if (back) back.onclick = () => {
    state.view = 'years';
    state.year = null;
    history.replaceState(null, '', location.pathname);
    render();
  };
  document.querySelectorAll('.standings-row').forEach(row => {
    row.onclick = () => {
      const gm = row.dataset.gm;
      if (state.expanded.has(gm)) state.expanded.delete(gm); else state.expanded.add(gm);
      render();
    };
  });
  const prevBtn = document.getElementById('prev-year-btn');
  if (prevBtn) prevBtn.onclick = gotoNewerYear;
  const nextBtn = document.getElementById('next-year-btn');
  if (nextBtn) nextBtn.onclick = gotoOlderYear;
  document.querySelectorAll('.player-link').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); openPlayerModal(btn.dataset.name, state.year); };
  });
}

init();
</script>
</body>
</html>
