<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 600">
  <defs>
    <radialGradient id="glowRed" cx="10%" cy="-8%" r="80%">
      <stop offset="0%" stop-color="#ff3450" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#ff3450" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="92%" cy="-6%" r="75%">
      <stop offset="0%" stop-color="#dab35e" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#dab35e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarmBase" cx="50%" cy="115%" r="60%">
      <stop offset="0%" stop-color="#dab35e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#dab35e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3450"/>
      <stop offset="50%" stop-color="#dab35e"/>
      <stop offset="100%" stop-color="#ff3450"/>
    </linearGradient>
    <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#dab35e" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="2400" height="600" fill="#08080a"/>
  <rect width="2400" height="600" fill="url(#dotGrid)"/>
  <rect width="2400" height="600" fill="url(#glowRed)"/>
  <rect width="2400" height="600" fill="url(#glowGold)"/>
  <rect width="2400" height="600" fill="url(#glowWarmBase)"/>

  <rect x="0" y="595" width="2400" height="5" fill="url(#accentBar)"/>
</svg>
